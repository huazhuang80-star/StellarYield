<script type="module">
import * as THREE from 'three';

/* ============================================================= config */

  { id:'turtle',  name:'玄甲龟',   tier:2, hp:90, coins:34,  r:3.6, speed:4,  w:4,  kind:'turtle', color:0x7abf7c },
  { id:'dolphin', name:'银弧海豚', tier:2, hp:110,coins:42,  r:3.8, speed:11, w:4,  kind:'std', color:0xa9c8e8, arc:1 },
  { id:'sword',   name:'звезда剑鱼', tier:3, hp:150,coins:60,  r:4.6, speed:14, w:3,  kind:'sword', color:0x5aa8d1 },
  { id:'shark',   name:'白煞鲨',   tier:3, hp:190,coins:80,  r:5.4, speed:10, w:3,  kind:'shark', color:0x7a8b95 },
  { id:'mermaid', name:'沧海人鱼', tier:3, hp:280,coins:140, r:5.0, speed:6,  w:1,  kind:'mermaid', color:0x66e8d8, drop:.6 },
  { id:'whale',   name:'星辉巨鲸', tier:3, hp:450,coins:200, r:8.5, speed:4,  w:1,  kind:'whale', color:0x6a7ec8, drop:.35 }
];
const BOSSES = [
  { id:'dragon', name:'东海神龙', hp:2600, coins:1500, kind:'dragon' },
  { id:'kraken', name:'深渊海皇', hp:2200, coins:1200, kind:'kraken' }
];
const COMBO_TIERS = [ {n:0,m:1}, {n:3,m:1.5}, {n:6,m:2}, {n:10,m:3}, {n:16,m:5} ];

/* ============================================================= save */
function load() {
  try { return Object.assign({ coins:300, lv:1, caught:0, items:{f:1,b:1,l:1}, auto:false, mute:false }, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); }
  catch { return { coins:300, lv:1, caught:0, items:{f:1,b:1,l:1}, auto:false, mute:false }; }
}
const S = load();
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch {} }

/* ============================================================= audio */
let AC = null, bgmOn = false, bgmTimer = 0, bossMode = false;
function ac() { if (!AC) { const C = window.AudioContext || window.webkitAudioContext; if (C) AC = new C(); } return AC; }
function env(g, t, a, d, peak) { g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(peak,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); }
function sfxShoot() { if (S.mute||!ac()) return; const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type='square'; o.frequency.setValueAtTime(700,t); o.frequency.exponentialRampToValueAtTime(160,t+.09);
  env(g,t,.005,.09,.10); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.12); }
function sfxHit() { if (S.mute||!ac()) return; const t=AC.currentTime, n=AC.sampleRate*.1|0, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900;
  const g=AC.createGain(); g.gain.value=.13; s.connect(f).connect(g).connect(AC.destination); s.start(t); }
function sfxCatch(v) { if (S.mute||!ac()) return; const t=AC.currentTime;
  const notes = v>=200?[523,659,784,1047,1319] : v>=60?[523,659,784,1047] : v>=20?[523,659,784] : [660,880];
  notes.forEach((f,i)=>{ const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle'; o.frequency.value=f;
    const st=t+i*.055; env(g,st,.004,.13,.12); o.connect(g).connect(AC.destination); o.start(st); o.stop(st+.2); }); }
function sfxRoar() { if (S.mute||!ac()) return; const t=AC.currentTime;
  for (let k=0;k<3;k++){ const o=AC.createOscillator(), g=AC.createGain(); o.type='sawtooth';
    const st=t+k*.2; o.frequency.setValueAtTime(90,st); o.frequency.linearRampToValueAtTime(150,st+.16);
    env(g,st,.01,.16,.20); o.connect(g).connect(AC.destination); o.start(st); o.stop(st+.22); } }
function sfxFreeze() { if (S.mute||!ac()) return; const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(1300,t); o.frequency.exponentialRampToValueAtTime(220,t+.5);
  env(g,t,.005,.45,.13); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.55); }
function sfxBoom() { if (S.mute||!ac()) return; const t=AC.currentTime, n=AC.sampleRate*.5|0, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(1600,t); f.frequency.exponentialRampToValueAtTime(110,t+.5);
  const g=AC.createGain(); g.gain.value=.3; s.connect(f).connect(g).connect(AC.destination); s.start(t); }
function sfxBolt() { if (S.mute||!ac()) return; const t=AC.currentTime, n=AC.sampleRate*.22|0, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for (let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(); s.buffer=b; const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=2200;
  const g=AC.createGain(); env(g,t,.002,.18,.2); s.connect(f).connect(g).connect(AC.destination); s.start(t); }
const SCALE = [220, 261.6, 293.7, 329.6, 392, 440, 523.3, 587.3];
function startBGM() {
  if (bgmOn || !ac()) return; bgmOn = true;
  const master = AC.createGain(); master.gain.value = .05; master.connect(AC.destination);
  const bass = AC.createOscillator(); bass.type='sine'; bass.frequency.value=55;
  const bg = AC.createGain(); bg.gain.value=.5; bass.connect(bg).connect(master); bass.start();
  const lfo = AC.createOscillator(); lfo.frequency.value=.15; const lg=AC.createGain(); lg.gain.value=6;
  lfo.connect(lg).connect(bass.frequency); lfo.start();
  let step = 0;
  bgmTimer = setInterval(() => {
    if (S.mute) return;
    const t = AC.currentTime, fast = bossMode;
    if (step % 2 === 0) {
      const o=AC.createOscillator(), g=AC.createGain(); o.type='triangle';
      o.frequency.value = SCALE[(step + (fast?3:0)) % SCALE.length] * (fast?1.5:1);
      env(g,t,.01,fast?.14:.24,.05); o.connect(g).connect(master); o.start(t); o.stop(t+.3);
    }
    if (fast && step % 4 === 0) { // percussion in boss mode
      const n=AC.sampleRate*.05|0, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
      for (let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
      const s=AC.createBufferSource(); s.buffer=b; const g=AC.createGain(); g.gain.value=.12;
      s.connect(g).connect(master); s.start(t);
    }
    step++;
  }, 250);
}

/* ============================================================= renderer / scene */
const canvas = document.getElementById('c');
let renderer, composer, bloom;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
} catch (e) {
  document.getElementById('err').style.display='block';
  document.getElementById('err').textContent = '此设备/浏览器不支持 WebGL：' + e.message;
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x03202f, .016);
scene.background = new THREE.Color(0x032030);

const camera = new THREE.PerspectiveCamera(58, 1, .1, 300);
const CAM_BASE = new THREE.Vector3(0, 3.5, 34);
camera.position.copy(CAM_BASE);
camera.lookAt(0, 0, -8);

scene.add(new THREE.AmbientLight(0x4a7a9a, 1.1));
const sun = new THREE.DirectionalLight(0xbfe8ff, 1.6); sun.position.set(6, 40, 10); scene.add(sun);
const fill = new THREE.PointLight(0x2a6a9a, 1.2, 120); fill.position.set(-20, 10, -10); scene.add(fill);

/* god rays — additive cones swaying from above */
const rays = [];
{

function stdMat(color, e=.35) {
  return new THREE.MeshStandardMaterial({ color, emissive:new THREE.Color(color).multiplyScalar(e), roughness:.45, metalness:.25 });
}
function buildStd(def) {
  const g = new THREE.Group(); const m = stdMat(def.color);
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 18, 12), m);
  body.scale.set(1.7, .85, .7); g.add(body);
  const tail = new THREE.Mesh(new THREE.ConeGeometry(.55, 1.1, 4), m);
  tail.rotation.z = Math.PI/2; tail.position.x = -1.9; g.add(tail);
  const fin = new THREE.Mesh(new THREE.ConeGeometry(.3, .7, 4), m);
  fin.position.set(.1, .85, 0); g.add(fin);
  for (const s of [-1,1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(.14, 8, 8), new THREE.MeshBasicMaterial({ color:0x0b1a24 }));
    e.position.set(1.15, .18, s*.5); g.add(e);
  }
  g.userData.tail = tail; return g;
}
function buildEel(def) { const g = buildStd(def); g.children[0].scale.set(3.2,.5,.5); g.userData.tail.position.x = -3.3; return g; }
function buildSword(def) {
  const g = buildStd(def);
  const bill = new THREE.Mesh(new THREE.ConeGeometry(.16, 2.4, 6), stdMat(0x2a5a7a));
  bill.rotation.z = -Math.PI/2; bill.position.x = 2.6; g.add(bill); return g;
}
function buildShark(def) {

  dorsal.position.set(0, 1.15, 0); g.add(dorsal);

  belly.scale.set(1.55, .7, .62); belly.position.y = -.16; g.add(belly); return g;
}
function buildPuffer(def) {
  const g = new THREE.Group(); const m = stdMat(def.color);
  const body = new THREE.Mesh(new THREE.SphereGeometry(1.1, 16, 12), m); g.add(body);
  const spikeMat = stdMat(0xc47845, .2);
  for (let i=0;i<16;i++) {

    const sp = new THREE.Mesh(new THREE.ConeGeometry(.1, .5, 4), spikeMat);
    sp.position.copy(dir.clone().multiplyScalar(1.05));
    sp.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir); g.add(sp);
  }
  for (const s of [-1,1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(.15, 8, 8), new THREE.MeshBasicMaterial({ color:0x0b1a24 }));
    e.position.set(.75, .3, s*.55); g.add(e);

  g.userData.tail = new THREE.Mesh(new THREE.ConeGeometry(.4,.8,4), m);
  g.userData.tail.rotation.z = Math.PI/2; g.userData.tail.position.x = -1.4; g.add(g.userData.tail);

}
function buildJelly(def) {

function buildDragon() {
  const g = new THREE.Group();
  const goldM = stdMat(0xd4af37, .65), redM = stdMat(0xc23b22, .45);
  const head = new THREE.Group();
  const skull = new THREE.Mesh(new THREE.SphereGeometry(2.2, 18, 14), goldM); skull.scale.set(1.5, 1, 1); head.add(skull);
  const snout = new THREE.Mesh(new THREE.CylinderGeometry(.8, 1.1, 1.6, 10), goldM);
  snout.rotation.z = Math.PI/2; snout.position.x = 2.6; head.add(snout);
  for (const s of [-1,1]) {
    const horn = new THREE.Mesh(new THREE.ConeGeometry(.35, 2.4, 6), goldM);
    horn.position.set(-.6, 1.9, s*1.0); horn.rotation.z = .55; horn.rotation.x = s*.3; head.add(horn);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(.32, 10, 8), new THREE.MeshBasicMaterial({ color:0xffe98a }));
    eye.position.set(1.4, .6, s*1.0); head.add(eye);
    const whisk = new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,3,4), goldM);
    whisk.position.set(3.1, -.3, s*.7); whisk.rotation.z = .9; whisk.rotation.x = s*.4; head.add(whisk);
  }
  g.add(head);
  const segs = [head], N = 11;
  for (let i=0;i<N;i++) {
    const r = 1.9 * (1 - i/(N+3));
    const seg = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), i%2 ? goldM : redM);
    g.add(seg); segs.push(seg);
    if (i % 3 === 1) { // dorsal ridge fins along the spine
      const fin = new THREE.Mesh(new THREE.ConeGeometry(.4, 1.1, 4), goldM);
      fin.position.y = r; seg.add(fin);
    }
  }
  const tailFin = new THREE.Mesh(new THREE.ConeGeometry(1.0, 2.2, 4), goldM);
  g.add(tailFin); segs.push(tailFin);
  g.userData = { segs, trail: [] };
  return g;
}
function buildKraken() {
  const g = new THREE.Group();
  const bodyM = stdMat(0x5a4380, .5);
  const head = new THREE.Mesh(new THREE.SphereGeometry(3.4, 18, 14), bodyM);
  head.scale.y = 1.25; g.add(head);
  const crownM = stdMat(0xf5c542, .8);
  for (let i=0;i<5;i++) {
    const spike = new THREE.Mesh(new THREE.ConeGeometry(.4, 1.6, 5), crownM);
    const a = (i/5)*Math.PI*2;
    spike.position.set(Math.cos(a)*1.6, 4.0, Math.sin(a)*1.6); g.add(spike);
  }
  for (const s of [-1,1]) {
    const e = new THREE.Mesh(new THREE.SphereGeometry(.55, 12, 10), new THREE.MeshBasicMaterial({ color:0xffe98a }));
    e.position.set(1.6, .8, s*1.7); g.add(e);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(.26, 8, 8), new THREE.MeshBasicMaterial({ color:0x1a0a2a }));
    pupil.position.set(2.05, .8, s*1.7); g.add(pupil);
  }
  const tentacles = [];
  for (let j=0;j<8;j++) {
    const chain = [];
    const a = (j/8)*Math.PI*2;
    for (let k=0;k<5;k++) {
      const r = .55*(1-k/7);
      const seg = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), bodyM);
      g.add(seg); chain.push(seg);
    }
    tentacles.push({ chain, a });
  }
  g.userData = { tentacles };
  return g;
}

/* spawn */
function pickDef() {
  let total = 0; for (const d of FISH) total += d.w || 0;
  let r = Math.random()*total;
  for (const d of FISH) { r -= d.w||0; if (r<=0) return d; }
  return FISH[0];
}
function spawnFish(def, opts={}) {
  const grp = (BUILDERS[def.kind] || buildStd)(def);
  const s = def.r / 2.2; grp.scale.setScalar(s);
  const fromLeft = Math.random() < .5;
  const y = -10 + Math.random()*20, z = -20 + Math.random()*16;
  grp.position.set(fromLeft ? -46 : 46, y, z);
  if (!fromLeft) grp.rotation.y = Math.PI;
  const glow = glowSprite(def.color, def.r*2.6); grp.add(glow); glow.position.set(0,0,0);
  scene.add(grp);
  const f = { def, grp, hp:def.hp, dir: fromLeft?1:-1, phase:Math.random()*Math.PI*2,
    baseY:y, amp:.5+Math.random()*2.2, freq:.4+Math.random()*.8, dead:false,
    speed:def.speed*(.85+Math.random()*.3), eaten:0, ...opts };
  fish.push(f); return f;
}
function spawnWave(def) {
  const n = def.school || 1;
  for (let i=0;i<n;i++) {
    const f = spawnFish(def);
    f.grp.position.x += -f.dir * i * def.r * 1.4;
    f.grp.position.y += (i%2? 1:-1) * .9;
    f.phase = i*.5;
  }
}
let spawnAcc = 0;
function spawner(dt) {
  spawnAcc += dt;
  const interval = .8;
  if (spawnAcc > interval && fish.length < 34) {
    spawnAcc = 0;
    const def = pickDef();
    if (def.school && Math.random()<.5) spawnWave(def); else spawnFish(def);
  }
  devourerTimer -= dt;
  if (devourerTimer <= 0) {
    devourerTimer = 70 + Math.random()*30;
    spawnFish({ id:'devour', name:'吞噬金鲲', tier:3, hp:350, coins:120, r:6, speed:5, kind:'devourer', color:0xffc83a, drop:1 });
  }
  bossTimer -= dt;
  if (bossTimer <= 0 && !boss) startBoss();
}
function startBoss() {
  const def = BOSSES[bossIdx % BOSSES.length]; bossIdx++;
  const warn = document.getElementById('warn');
  warn.textContent = '⚠ ' + def.name + ' 现身 ⚠';
  warn.style.display = 'block';
  sfxRoar();
  setTimeout(() => { warn.style.display = 'none'; }, 2200);
  setTimeout(() => {
    const grp = def.kind === 'dragon' ? buildDragon() : buildKraken();
    grp.position.set(-52, 2, -14);
    scene.add(grp);
    boss = { def, grp, hp:def.hp, dir:1, t:0, rage:false };
    bossMode = true;
    document.getElementById('bossWrap').style.display = 'block';
    document.getElementById('bossName').textContent = def.name;
  }, 1600);
}

/* ============================================================= turret */
const turret = new THREE.Group();
{
  const base = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 3.0, 1.2, 16), stdMat(0x1a4258, .2));
  turret.add(base);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(2.1, .16, 8, 24), new THREE.MeshBasicMaterial({ color:0x6fe3ff }));
  ring.rotation.x = Math.PI/2; ring.position.y = .7; turret.add(ring);
  turret.userData.ring = ring;
}
const barrel = new THREE.Group();
{
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(.5, .75, 4.4, 12), stdMat(0x2a6a8a, .3));
  tube.position.y = 2.2; barrel.add(tube);
  const muzzle = new THREE.Mesh(new THREE.CylinderGeometry(.8, .62, .8, 12), stdMat(0x6fe3ff, .6));
  muzzle.position.y = 4.4; barrel.add(muzzle);
  barrel.userData = { tube, muzzle };
}
turret.add(barrel);
turret.position.set(0, -14.5, 4);
scene.add(turret);
const muzzleGlow = glowSprite(0x9fd8ff, 3); muzzleGlow.position.set(0, 4.8, 0); muzzleGlow.material.opacity = 0; barrel.add(muzzleGlow);

const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2(0, .3);
let aimDir = new THREE.Vector3(0, .5, -1).normalize();
function updateAim() {
  raycaster.setFromCamera(pointerNdc, camera);
  aimDir = raycaster.ray.direction.clone();
  // rotate barrel to aim
  const target = turret.position.clone().add(aimDir.clone().multiplyScalar(30));
  const local = target.sub(turret.position);
  const yaw = Math.atan2(local.x, -local.z);
  const pitch = Math.atan2(local.y, Math.hypot(local.x, local.z));
  barrel.rotation.set(0,0,0);
  barrel.rotateY(yaw);
  barrel.rotateX(Math.PI/2 - pitch - Math.PI/2 + (Math.PI/2 - pitch) * 0); // keep simple below
  barrel.rotation.x = -(Math.PI/2 - pitch) + Math.PI/2 - Math.PI/2;
  barrel.rotation.x = pitch - Math.PI/2;
}
function fire(now) {
  const L = LEVELS[S.lv-1];
  if (now - lastFire < 220) return;
  if (S.coins < L.cost) return;
  lastFire = now; S.coins -= L.cost; save(); hudCoins();
  sfxShoot();
  muzzleGlow.material.opacity = .9;
  const spawn = turret.position.clone().add(aimDir.clone().multiplyScalar(5));
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(.45, 10, 8),
    new THREE.MeshBasicMaterial({ color:L.color }));
  mesh.position.copy(spawn);
  const glow = glowSprite(L.color, 2.4); mesh.add(glow);
  scene.add(mesh);
  bullets.push({ mesh, dir:aimDir.clone(), dmg:L.dmg, level:L.lv });
}

/* ============================================================= kill flow */
function project(pos) {
  const v = pos.clone().project(camera);
  return { x:(v.x*.5+.5)*window.innerWidth, y:(-v.y*.5+.5)*window.innerHeight };
}
function flipNum(pos, text, big) {
  const el = document.createElement('div');
  el.className = 'flip';
  el.style.fontSize = big ? 'min(9vw,58px)' : 'min(5.5vw,34px)';
  el.textContent = text;
  const p = project(pos);
  el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
  document.getElementById('hud').appendChild(el);
  setTimeout(() => el.remove(), 1200);
}
function comboMult() {
  let m = 1;
  for (const t of COMBO_TIERS) if (combo.n >= t.n) m = t.m;
  return m;
}
function onKill(f) {
  const now = performance.now();
  combo.n = (now - combo.last < 3000) ? combo.n + 1 : 1;
  combo.last = now;
  const m = comboMult();
  let value = Math.round((f.def.coins + (f.eaten||0)*4) * m);
  S.coins += value; S.caught++;
  save(); hudCoins();
  const pos = f.grp.position;
  sfxCatch(value);
  burstCoins(pos, Math.min(26, 5 + (value>>3)));
  shockwave(pos, f.def.tier >= 3 ? 0xff9d4a : 0xffd54a, 8 + f.def.r);
  flipNum(pos, (m>1 ? `×${m} ` : '') + `+${value}`, f.def.tier >= 3);
  shake = Math.max(shake, f.def.tier >= 3 ? .8 : .25);
  if (f.def.tier >= 3) { slowUntil = now + 900; }
  if (combo.n >= 3) {
    const c = document.getElementById('combo');
    c.style.display = 'block'; c.textContent = `${combo.n} 连击 ×${m}`;
    c.style.animation = 'none'; void c.offsetWidth; c.style.animation = '';
  }
  // drops
  const p = f.def.drop || (f.def.tier===3 ? .12 : .015);
  if (Math.random() < p) {
    const keys = ['f','b','l'];
    const k = keys[(Math.random()*3)|0];
    S.items[k] = Math.min(9, (S.items[k]||0)+1); save(); hudItems();
    flipNum(pos.clone().add(new THREE.Vector3(0,-2,0)), '+道具', false);
  }
  removeFish(f);
}
function removeFish(f) {
  f.dead = true;
  scene.remove(f.grp);
  f.grp.traverse(o => { if (o.geometry) o.geometry.dispose?.(); });
}
function onBossKill() {
  const pos = boss.grp.position.clone();
  const value = boss.def.coins;
  S.coins += value; S.caught++;
  save(); hudCoins();
  // cinematic
  slowUntil = performance.now() + 1600;
  shake = 2.2;
  const flash = document.getElementById('flash');
  flash.style.transition = 'none'; flash.style.opacity = .95;
  requestAnimationFrame(() => { flash.style.transition = 'opacity 1.1s'; flash.style.opacity = 0; });
  sfxBoom(); sfxCatch(999);
  for (let i=0;i<5;i++) setTimeout(() => burstCoins(pos.clone().add(new THREE.Vector3((Math.random()-.5)*8,(Math.random()-.5)*6,0)), 30), i*130);
  shockwave(pos, 0xff5c9c, 30); shockwave(pos, 0xffd54a, 22);
  flipNum(pos, `击败 ${boss.def.name} +${value}`, true);
  // guaranteed triple item
  for (const k of ['f','b','l']) S.items[k] = Math.min(9, (S.items[k]||0)+1);
  save(); hudItems();
  scene.remove(boss.grp);
  boss = null; bossMode = false; bossTimer = 75 + Math.random()*30;
  document.getElementById('bossWrap').style.display = 'none';
}
function damageBoss(dmg, hitPos) {
  if (!boss) return;
  boss.hp -= dmg;
  sfxHit();
  if (hitPos) shockwave(hitPos, 0xff8a8a, 4);
  document.getElementById('bossFill').style.width = Math.max(0, boss.hp/boss.def.hp*100) + '%';
  if (!boss.rage && boss.hp < boss.def.hp*.45) {
    boss.rage = true; sfxRoar();
    boss.grp.traverse(o => { if (o.material?.emissive) { o.material = o.material.clone(); o.material.emissive = new THREE.Color(0xff2020); o.material.emissiveIntensity = .9; } });
  }
  if (boss.hp <= 0) onBossKill();
}

/* chain lightning helper */
function chainFrom(origin, count, dmg, exclude) {
  let src = origin.clone(); let last = null; let hit = 0;
  const done = new Set(exclude ? [exclude] : []);
  for (let j=0;j<count;j++) {
    let best = null, bd = 1e9;
    for (const f of fish) {
      if (f.dead || done.has(f)) continue;
      const d = f.grp.position.distanceTo(src);
      if (d < bd && d < 16) { bd = d; best = f; }
    }
    if (!best) break;
    done.add(best);
    lightningArc(src, best.grp.position);
    src = best.grp.position.clone();
    best.hp -= dmg;
    hit++;
    if (best.hp <= 0) onKill(best);
  }
  if (hit) sfxBolt();
  return hit;
}

/* items */
function useItem(k) {
  if (!S.items[k]) return;
  const now = performance.now();
  if (k === 'f') {
    frozenUntil = now + 4200;
    document.getElementById('freezeTint').style.opacity = 1;
    setTimeout(() => document.getElementById('freezeTint').style.opacity = 0, 4200);
    sfxFreeze();
  } else if (k === 'b') {
    // AOE around aim ray
    sfxBoom(); shake = 1.6;
    raycaster.setFromCamera(pointerNdc, camera);
    const kills = [];
    for (const f of fish) {
      if (f.dead) continue;
      const d = raycaster.ray.distanceToPoint(f.grp.position);
      if (d < 11) kills.push(f);
    }
    const c = raycaster.ray.at(28, new THREE.Vector3());
    shockwave(c, 0xff9d4a, 26);
    for (const f of kills) { f.hp = 0; onKill(f); }
    if (boss && raycaster.ray.distanceToPoint(boss.grp.position) < 14) damageBoss(300, boss.grp.position);
  } else if (k === 'l') {
    raycaster.setFromCamera(pointerNdc, camera);
    const at = raycaster.ray.at(24, new THREE.Vector3());
    const n = chainFrom(at, 8, 150);
    if (!n) return; // refund if nothing hit
  }
  S.items[k]--; save(); hudItems();
}

/* ============================================================= HUD wiring */
const $ = id => document.getElementById(id);
function hudCoins() { $('coins').textContent = S.coins; $('caught').textContent = '已捕获 ' + S.caught; }
function hudLv() { const L = LEVELS[S.lv-1]; $('lvText').textContent = `Lv ${L.lv} · 伤害 ${L.dmg} · 每发 ${L.cost}`;
  barrel.userData.muzzle.material.color.setHex(L.color); turret.userData.ring.material.color.setHex(L.color); }
function hudItems() {
  const map = { f:'itFreeze', b:'itBomb', l:'itBolt' };
  for (const k in map) { const el = $(map[k]); el.querySelector('.cnt').textContent = S.items[k]||0;
    el.classList.toggle('dim', !(S.items[k]>0)); }
}
function hudAuto() { $('btnAuto').classList.toggle('on', S.auto); }
function hudSound() { $('btnSound').classList.toggle('off', S.mute); $('btnSound').textContent = S.mute ? '静音' : '声音'; }
$('lvUp').addEventListener('click', e => { e.stopPropagation(); if (S.lv < 10) { S.lv++; save(); hudLv(); } });
$('lvDown').addEventListener('click', e => { e.stopPropagation(); if (S.lv > 1) { S.lv--; save(); hudLv(); } });
$('btnAuto').addEventListener('click', e => { e.stopPropagation(); S.auto = !S.auto; save(); hudAuto(); });
$('btnSound').addEventListener('click', e => { e.stopPropagation(); S.mute = !S.mute; save(); hudSound(); });
$('btnPause').addEventListener('click', e => { e.stopPropagation(); paused = !paused; $('btnPause').textContent = paused ? '▶' : '⏸'; });
$('itFreeze').addEventListener('click', e => { e.stopPropagation(); useItem('f'); });
$('itBomb').addEventListener('click', e => { e.stopPropagation(); useItem('b'); });
$('itBolt').addEventListener('click', e => { e.stopPropagation(); useItem('l'); });
window.addEventListener('keydown', e => {
  if (e.key === '1') useItem('f');
  else if (e.key === '2') useItem('b');
  else if (e.key === '3') useItem('l');
  else if (e.key.toLowerCase() === 'p') { paused = !paused; $('btnPause').textContent = paused ? '▶' : '⏸'; }
});
hudCoins(); hudLv(); hudItems(); hudAuto(); hudSound();

/* pointer */
let pointerHeld = false;
function setNdc(cx, cy) {
  pointerNdc.x = (cx / window.innerWidth) * 2 - 1;
  pointerNdc.y = -(cy / window.innerHeight) * 2 + 1;
}
canvas.addEventListener('pointermove', e => setNdc(e.clientX, e.clientY));
canvas.addEventListener('pointerdown', e => {
  setNdc(e.clientX, e.clientY); pointerHeld = true;
  const acx = ac(); if (acx && acx.state === 'suspended') acx.resume();
  if (!started) { started = true; $('start').style.display = 'none'; startBGM(); return; }
  if (!paused) fire(performance.now());
});
window.addEventListener('pointerup', () => pointerHeld = false);
$('start').addEventListener('pointerdown', () => {
  const acx = ac(); if (acx && acx.state === 'suspended') acx.resume();
  started = true; $('start').style.display = 'none'; startBGM();
});

/* ============================================================= update loop */
function updateFish(dt, now) {
  const frozen = now < frozenUntil;
  for (const f of fish) {
    if (f.dead) continue;
    const sp = frozen ? 0 : f.speed;
    f.grp.position.x += f.dir * sp * dt;
    f.phase += dt * f.freq * 4;
    f.grp.position.y = f.baseY + Math.sin(f.phase) * f.amp * (f.def.arc ? 3 : 1);
    const vy = Math.cos(f.phase) * f.amp * (f.def.arc ? 3 : 1) * f.freq * 4;
    f.grp.rotation.z = Math.atan2(vy * .06, 1) * f.dir;
    if (f.grp.userData.tail) f.grp.userData.tail.rotation.y = Math.sin(now*.012 + f.phase) * .5;
    if (f.grp.userData.wings) for (let i=0;i<2;i++) f.grp.userData.wings[i].rotation.z = (i?1:-1)*(.2 + Math.sin(now*.004+f.phase)*.35);
    if (f.grp.userData.flippers) for (let i=0;i<4;i++) f.grp.userData.flippers[i].rotation.y = Math.sin(now*.006+i)*(.5);
    if (f.grp.userData.bell) { const s = 1 + Math.sin(now*.005+f.phase)*.12; f.grp.userData.bell.scale.set(s, 1, s); }
    if (f.grp.userData.tents) f.grp.userData.tents.forEach((t,i) => t.rotation.x = Math.sin(now*.004+i)*.25);
    // devourer eats smaller fish
    if (f.def.kind === 'devourer') {
      for (const o of fish) {
        if (o === f || o.dead || o.def.tier > 1) continue;
        if (o.grp.position.distanceTo(f.grp.position) < f.def.r) {
          removeFish(o); f.eaten++; f.grp.scale.multiplyScalar(1.02);
          flipNum(f.grp.position, '吞噬 +' + f.eaten, false);
        }
      }
    }
    if (Math.abs(f.grp.position.x) > 52) removeFish(f);
  }
  for (let i=fish.length-1;i>=0;i--) if (fish[i].dead) fish.splice(i,1);
}
function updateBoss(dt, now) {
  if (!boss) return;
  boss.t += dt;
  const speed = (boss.rage ? 7 : 4.2) * (now < frozenUntil ? .15 : 1);
  const g = boss.grp;
  g.position.x += boss.dir * speed * dt;
  if (g.position.x > 38) boss.dir = -1;
  if (g.position.x < -38) boss.dir = 1;
  g.position.y = 2 + Math.sin(boss.t*.5) * 6;
  if (boss.def.kind === 'dragon') {
    const ud = g.userData;
    // head orientation
    ud.segs[0].rotation.y = boss.dir > 0 ? 0 : Math.PI;
    ud.trail.unshift(new THREE.Vector3(0, g.position.y - 2, 0).set(g.position.x, g.position.y, g.position.z));
    if (ud.trail.length > 300) ud.trail.pop();
    for (let i=1;i<ud.segs.length;i++) {
      const idx = Math.min(i*7, ud.trail.length-1);
      if (idx >= 0 && ud.trail[idx]) {
        ud.segs[i].position.copy(ud.trail[idx]).sub(g.position);
        ud.segs[i].position.y += Math.sin(boss.t*2 + i*.6) * .8;
      }
    }
  } else {
    const ud = g.userData;
    for (const t of ud.tentacles) {
      for (let k=0;k<t.chain.length;k++) {
        const reach = 3.4 + k*1.35;
        const sway = Math.sin(boss.t*2.2 + t.a*3 + k*.7) * (.5+k*.22);
        t.chain[k].position.set(Math.cos(t.a)*reach + sway*Math.sin(t.a), -2 - k*1.1 + Math.cos(boss.t*1.8+k)*.4, Math.sin(t.a)*reach*.6 + sway*Math.cos(t.a)*.4);
      }
    }
    if (boss.rage && Math.random() < dt*2) {
      const tips = ud.tentacles.map(t => t.chain[4].getWorldPosition(new THREE.Vector3()));
      const a = tips[(Math.random()*8)|0], b = tips[(Math.random()*8)|0];
      if (a && b) lightningArc(a, b, 0xff8ad4);
    }
  }
}
function updateBullets(dt) {
  for (const b of bullets) {
    b.mesh.position.addScaledVector(b.dir, 60*dt);
    let hit = false;
    // boss collision
    if (boss) {
      const parts = boss.def.kind === 'dragon' ? boss.grp.userData.segs : [boss.grp];
      for (const p of parts) {
        const wp = p.getWorldPosition(new THREE.Vector3());
        if (b.mesh.position.distanceTo(wp) < 3.4) {
          damageBoss(b.dmg, b.mesh.position);
          hit = true; break;
        }
      }
    }
    if (!hit) for (const f of fish) {
      if (f.dead) continue;
      if (b.mesh.position.distanceTo(f.grp.position) < f.def.r*.75 + .6) {
        f.hp -= b.dmg;
        sfxHit();
        shockwave(b.mesh.position, LEVELS[b.level-1].color, 3);
        if (f.hp <= 0) {
          onKill(f);
          if (b.level >= 8) chainFrom(f.grp.position, 2, b.dmg*.4, f); // high-level chain
        }
        hit = true; break;
      }
    }
    if (hit || b.mesh.position.length() > 90) {
      scene.remove(b.mesh); b.dead = true;
    }
  }
  for (let i=bullets.length-1;i>=0;i--) if (bullets[i].dead) bullets.splice(i,1);
}
function updateFx(dt, now) {
  for (const c of coins3d) {
    if (c.life <= 0) continue;
    c.life -= dt;
    c.v.y -= 26*dt;
    c.m.position.addScaledVector(c.v, dt);
    c.m.rotation.x += c.spin.x*dt; c.m.rotation.y += c.spin.y*dt; c.m.rotation.z += c.spin.z*dt;
    if (c.life <= 0) c.m.visible = false;
  }
  for (const s of shockwaves) {
    s.t += dt*2.4;
    s.m.scale.setScalar(1 + s.t * s.max);
    s.m.material.opacity = Math.max(0, .9 - s.t);
    s.m.quaternion.copy(camera.quaternion);
    if (s.t >= 1) { scene.remove(s.m); s.dead = true; }
  }
  for (let i=shockwaves.length-1;i>=0;i--) if (shockwaves[i].dead) shockwaves.splice(i,1);
  for (const a of arcs) {
    a.t += dt*4;
    a.line.material.opacity = Math.max(0, 1 - a.t);
    if (a.t >= 1) { scene.remove(a.line); a.line.geometry.dispose(); a.dead = true; }
  }
  for (let i=arcs.length-1;i>=0;i--) if (arcs[i].dead) arcs.splice(i,1);
  muzzleGlow.material.opacity = Math.max(0, muzzleGlow.material.opacity - dt*4);
  // bubbles rise
  for (let i=0;i<bubblePos.length/3;i++) {
    bubblePos[i*3+1] += dt * (1.2 + (i%5)*.3);
    bubblePos[i*3] += Math.sin(now*.001 + i) * dt * .4;
    if (bubblePos[i*3+1] > 18) bubblePos[i*3+1] = -16;
  }
  bubbleGeo.attributes.position.needsUpdate = true;
  for (const k of kelps) k.rotation.z = Math.sin(now*.001*k.userData.f + k.userData.sway) * .12;
  for (let i=0;i<rays.length;i++) rays[i].rotation.y = Math.sin(now*.0002 + i) * .3;
  // combo timeout
  if (combo.n && now - combo.last > 3000) { combo.n = 0; $('combo').style.display = 'none'; }
}
function loop(nowRaw) {
  requestAnimationFrame(loop);
  const now = performance.now();
  let dt = (now - clock.last) / 1000; clock.last = now;
  if (dt > .1) dt = .1;
  // slow-mo
  const targetScale = now < slowUntil ? .16 : 1;
  timeScale += (targetScale - timeScale) * Math.min(1, dt*8);
  const sdt = dt * timeScale;
  if (started && !paused) {
    updateAim();
    if (S.auto && pointerHeld) fire(now);
    spawner(sdt);
    updateFish(sdt, now);
    updateBoss(sdt, now);
    updateBullets(sdt);
    updateFx(sdt, now);
  }
  // camera shake decay
  if (shake > 0) {
    shake = Math.max(0, shake - dt*2.4);
    camera.position.set(CAM_BASE.x + (Math.random()-.5)*shake, CAM_BASE.y + (Math.random()-.5)*shake, CAM_BASE.z);
  } else camera.position.copy(CAM_BASE);
  composer.render();
}
requestAnimationFrame(loop);

/* debug hooks for automated testing */
window.__game = {
  state: S,
  get fishCount() { return fish.length; },
  fishScreen() { return fish.filter(f=>!f.dead).map(f => { const p = project(f.grp.position); return { x:p.x, y:p.y, id:f.def.id }; }); },
  bossInfo() { return boss ? { name:boss.def.name, hp:boss.hp } : null;},
  forceBoss() { bossTimer = 0; },
  addCoins(n) { S.coins += n; hudCoins(); }
};
