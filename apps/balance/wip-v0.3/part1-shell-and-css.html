<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6C74">
<title>BALANCE 双向体重管理</title>
</head>
<body>
<!--APP-START-->
<style>
:root{
  --paper:#EDF1EE; --card:#FFFFFF; --card-2:#F6F8F6;
  --ink:#16211D; --muted:#5F6E67; --faint:#8A9791;
  --line:#D3DCD6; --line-strong:#B9C6BF;
  --accent:#1F6C74; --accent-ink:#0F3F45; --accent-soft:#DBE9E9;
  --good:#2F6D4F; --limit:#8A6A2B; --avoid:#A8382C;
  --good-bg:#E4EEE7; --limit-bg:#F3EBDA; --avoid-bg:#F6E4E1;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Songti TC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --base:15px; --r:10px; --shell:480px;
}
:root[data-skin="die"]{ --paper:#EDF2F0; --card-2:#F4F9F7; --ink:#152220; --muted:#5B6E69;
  --line:#D2E0DB; --accent:#0E7C6B; --accent-ink:#08453C; --accent-soft:#D6EBE5; }
:root[data-skin="yang"]{ --paper:#F0F0EA; --card-2:#F7F7F1; --ink:#1D2118; --muted:#5F6553;
  --line:#D8D9CC; --accent:#4A6B3A; --accent-ink:#2A3F20; --accent-soft:#E2E9DA; --base:17px; }
@media (prefers-color-scheme:dark){
  :root{ --paper:#0E1512; --card:#161F1B; --card-2:#1C2621; --ink:#E6EDE8; --muted:#94A39C;
    --faint:#71807A; --line:#26332D; --line-strong:#354640; --accent:#63B4AF; --accent-ink:#A9D9D4;
    --accent-soft:#1B2F30; --good:#6FB78C; --limit:#C9A961; --avoid:#DE8C80;
    --good-bg:#172A20; --limit-bg:#2A2418; --avoid-bg:#2C1D1B; }
}
:root[data-theme="dark"]{ --paper:#0E1512; --card:#161F1B; --card-2:#1C2621; --ink:#E6EDE8;
  --muted:#94A39C; --faint:#71807A; --line:#26332D; --line-strong:#354640; --accent:#63B4AF;
  --accent-ink:#A9D9D4; --accent-soft:#1B2F30; --good:#6FB78C; --limit:#C9A961; --avoid:#DE8C80;
  --good-bg:#172A20; --limit-bg:#2A2418; --avoid-bg:#2C1D1B; }
:root[data-theme="light"]{ --paper:#EDF1EE; --card:#FFFFFF; --card-2:#F6F8F6; --ink:#16211D;
  --muted:#5F6E67; --faint:#8A9791; --line:#D3DCD6; --line-strong:#B9C6BF; --accent:#1F6C74;
  --accent-ink:#0F3F45; --accent-soft:#DBE9E9; --good:#2F6D4F; --limit:#8A6A2B; --avoid:#A8382C;
  --good-bg:#E4EEE7; --limit-bg:#F3EBDA; --avoid-bg:#F6E4E1; }
:root[data-theme="light"][data-skin="die"]{ --accent:#0E7C6B; --accent-soft:#D6EBE5; --paper:#EDF2F0; }
:root[data-theme="light"][data-skin="yang"]{ --accent:#4A6B3A; --accent-soft:#E2E9DA; --paper:#F0F0EA; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font:var(--base)/1.65 var(--sans); -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; text-wrap:balance; margin:0; letter-spacing:.01em}
button{font:inherit; color:inherit; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

#app{max-width:var(--shell); margin:0 auto; min-height:100vh; background:var(--paper); display:flex; flex-direction:column}
@media (min-width:560px){ body{background:var(--card-2)} #app{border-left:1px solid var(--line); border-right:1px solid var(--line)} }
.topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:.7rem 1rem; display:flex; align-items:center; gap:.7rem; min-height:56px}
.avatar{width:38px; height:38px; border-radius:50%; background:var(--accent-soft); display:grid; place-items:center;
  font-size:20px; flex:none; border:1px solid var(--line); position:relative}
.avatar .hp{position:absolute; bottom:-3px; left:2px; right:2px; height:3px; background:var(--line); border-radius:9px; overflow:hidden}
.avatar .hp>i{display:block; height:100%; background:var(--good)}
.topmeta{flex:1; min-width:0}
.topmeta b{font-family:var(--serif); font-size:.98rem; display:block; line-height:1.3}
.topmeta span{font-size:.74rem; color:var(--muted); display:block}
.backbtn{background:none; border:0; font-size:1.3rem; line-height:1; padding:.2rem .45rem .3rem; color:var(--accent); flex:none}
main{flex:1; padding:1rem 1rem 5.5rem}
.tabs{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex;
  background:color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter:blur(12px);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:560px){ .tabs{max-width:var(--shell); margin:0 auto; border-left:1px solid var(--line); border-right:1px solid var(--line)} }
.tabs button{flex:1; background:none; border:0; padding:.55rem .2rem .6rem; display:grid; gap:.12rem;
  justify-items:center; color:var(--muted); font-size:.68rem; letter-spacing:.03em}
.tabs button i{font-style:normal; font-size:19px; line-height:1}
.tabs button[aria-current="page"]{color:var(--accent); font-weight:600}

.stack{display:flex; flex-direction:column; gap:.85rem}
.row{display:flex; align-items:center; gap:.6rem}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:1rem}
.card.flat{background:var(--card-2)}
.card.pad0{padding:0; overflow:hidden}
.eyebrow{font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:600}
.lede{color:var(--muted); font-size:.86rem; margin:.3rem 0 0}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.btn{background:var(--accent); color:#fff; border:0; border-radius:8px; padding:.68rem 1rem; font-weight:600; font-size:.92rem; width:100%; transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--line-strong)}
.btn.mini{width:auto; padding:.4rem .75rem; font-size:.8rem}
.btn.danger{color:var(--avoid); border-color:color-mix(in srgb,var(--avoid) 40%,transparent)}
.btn:disabled{opacity:.45; cursor:not-allowed}
label.field{display:block; font-size:.8rem; color:var(--muted); margin-bottom:.9rem}
label.field b{display:block; color:var(--ink); font-weight:600; margin-bottom:.3rem; font-size:.85rem}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%; padding:.6rem .7rem;
  border:1px solid var(--line-strong); border-radius:8px; background:var(--card)}
textarea{min-height:80px; resize:vertical}
.seg{display:flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; background:var(--card)}
.seg button{flex:1; background:none; border:0; padding:.55rem .4rem; font-size:.85rem; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff; font-weight:600}
.seg.wrap{flex-wrap:wrap}
.tag{font-size:.7rem; padding:.1rem .42rem; border-radius:4px; font-weight:600; white-space:nowrap; display:inline-block}
.tag.good{background:var(--good-bg); color:var(--good)}
.tag.limit{background:var(--limit-bg); color:var(--limit)}
.tag.avoid{background:var(--avoid-bg); color:var(--avoid)}
.tag.n{background:var(--accent-soft); color:var(--accent-ink)}
.note{font-size:.76rem; color:var(--muted); line-height:1.6}
.hr{height:1px; background:var(--line); border:0; margin:.2rem 0}
.chip{font-size:.7rem; padding:.16rem .5rem; border:1px solid var(--line-strong); border-radius:20px; color:var(--muted); white-space:nowrap; background:var(--card)}
.chip.on{background:var(--accent-soft); border-color:transparent; color:var(--accent-ink); font-weight:600}

.nav{display:flex; align-items:center; gap:.7rem; padding:.8rem 1rem; border-bottom:1px solid var(--line);
  background:none; border-left:0; border-right:0; border-top:0; width:100%; text-align:left}
.nav:last-child{border-bottom:0}
.nav i{font-style:normal; font-size:19px; width:1.6rem; flex:none; text-align:center}
.nav .t{flex:1; min-width:0}
.nav .t b{display:block; font-size:.9rem; font-weight:600}
.nav .t span{display:block; font-size:.75rem; color:var(--muted); line-height:1.45}
.nav .arw{color:var(--faint); font-size:1rem}

.kcal .big{font-family:var(--mono); font-size:2.1rem; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.kcal .of{color:var(--muted); font-size:.8rem}
.bar{height:7px; background:var(--card-2); border-radius:99px; overflow:hidden; border:1px solid var(--line)}
.bar>i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s}
.bar>i.over{background:var(--avoid)}
.bar.sm{height:5px}
.macros{display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.8rem}
.macro{background:var(--card-2); border-radius:8px; padding:.5rem .6rem}
.macro span{font-size:.7rem; color:var(--muted); display:block}
.macro b{font-family:var(--mono); font-size:.95rem; font-variant-numeric:tabular-nums}
.macro small{color:var(--muted); font-size:.7rem}
.meal{display:flex; gap:.7rem; align-items:flex-start; padding:.6rem 0; border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .slot{font-size:.7rem; color:var(--faint); width:2.4rem; flex:none; padding-top:.15rem}
.meal .body{flex:1; min-width:0}
.meal .body b{font-weight:600; font-size:.9rem}
.meal .kc{font-family:var(--mono); font-size:.85rem; color:var(--muted); flex:none; font-variant-numeric:tabular-nums}
.iconbtn{background:none; border:0; color:var(--faint); padding:.1rem .3rem; font-size:1rem; line-height:1}

.q{border:1px solid var(--line); border-radius:var(--r); padding:.9rem; background:var(--card); margin-bottom:.7rem}
.q p{margin:0 0 .6rem; font-size:.92rem; line-height:1.5}
.q .qn{font-family:var(--mono); color:var(--faint); font-size:.75rem; margin-right:.4rem}
.likert{display:grid; grid-template-columns:repeat(5,1fr); gap:.3rem}
.likert button{background:var(--card-2); border:1px solid var(--line); border-radius:6px; padding:.45rem .1rem; font-size:.68rem; color:var(--muted); line-height:1.25}
.likert button[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:transparent; font-weight:600}
.progress{position:sticky; top:56px; z-index:10; background:var(--paper); padding:.5rem 0 .7rem}

svg.chart{display:block; width:100%; height:auto; overflow:visible}
.scorerow{display:flex; align-items:center; gap:.5rem; font-size:.82rem; padding:.22rem 0}
.scorerow .nm{width:3.6rem; flex:none}
.scorerow .tr{flex:1; height:6px; background:var(--card-2); border-radius:99px; border:1px solid var(--line); overflow:hidden}
.scorerow .tr>i{display:block; height:100%; background:var(--accent)}
.scorerow .vl{width:2.3rem; text-align:right; font-family:var(--mono); font-size:.78rem; flex:none}

.sos-ring{display:grid; place-items:center; margin:.5rem auto 1rem}
.choices{display:grid; gap:.5rem}
.choice{text-align:left; background:var(--card); border:1px solid var(--line-strong); border-radius:8px; padding:.7rem .85rem; font-size:.88rem; width:100%}
.choice[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.choice b{display:block; font-size:.9rem}
.choice span{font-size:.76rem; color:var(--muted); display:block}

.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:.6rem}
.badge{text-align:center; padding:.7rem .3rem; border:1px solid var(--line); border-radius:var(--r); background:var(--card-2); opacity:.42; width:100%}
.badge.got{opacity:1; background:var(--card); border-color:var(--accent)}
.badge i{font-style:normal; font-size:22px; display:block; line-height:1.4}
.badge span{font-size:.7rem; display:block; line-height:1.3}
.foodrow{display:flex; align-items:center; gap:.6rem; padding:.55rem 0; border-bottom:1px solid var(--line)}
.foodrow:last-child{border-bottom:0}
.foodrow .nm{flex:1; min-width:0; font-size:.9rem}
.foodrow .nm small{display:block; color:var(--muted); font-size:.72rem; font-family:var(--mono)}
.warn{background:var(--limit-bg); border:1px solid color-mix(in srgb,var(--limit) 35%, transparent); border-radius:var(--r); padding:.75rem .85rem; font-size:.82rem; line-height:1.6}
.danger-box{background:var(--avoid-bg); border:1px solid color-mix(in srgb,var(--avoid) 35%, transparent); border-radius:var(--r); padding:.85rem; font-size:.85rem; line-height:1.65}
.disclaim{font-size:.72rem; color:var(--faint); line-height:1.6; padding:.5rem 0 1rem}
.empty{text-align:center; color:var(--muted); font-size:.85rem; padding:1.5rem .5rem}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:.6rem}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem}
.stat{background:var(--card-2); border:1px solid var(--line); border-radius:8px; padding:.6rem .7rem}
.stat span{font-size:.7rem; color:var(--muted); display:block}
.stat b{font-family:var(--mono); font-size:1.15rem; font-variant-numeric:tabular-nums; font-weight:600}
.stat small{font-size:.68rem; color:var(--faint); display:block; margin-top:.1rem}

.heat{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.heat i{display:block; aspect-ratio:1; border-radius:3px; background:var(--card-2); border:1px solid var(--line)}
.heat i[data-l="1"]{background:color-mix(in srgb,var(--accent) 25%,var(--card-2)); border-color:transparent}
.heat i[data-l="2"]{background:color-mix(in srgb,var(--accent) 55%,var(--card-2)); border-color:transparent}
.heat i[data-l="3"]{background:var(--accent); border-color:transparent}
.heat i[data-l="x"]{background:color-mix(in srgb,var(--avoid) 45%,var(--card-2)); border-color:transparent}
.heatlab{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; font-size:.62rem; color:var(--faint); text-align:center; margin-bottom:2px}

.acc{border-bottom:1px solid var(--line)}
.acc:last-child{border-bottom:0}
.acc>button{width:100%; background:none; border:0; text-align:left; padding:.85rem 1rem; display:flex; gap:.6rem; align-items:center; font-size:.9rem}
.acc>button .arw{margin-left:auto; color:var(--faint); transition:transform .2s}
.acc[open]>button .arw{transform:rotate(90deg)}
.acc .body{padding:0 1rem 1rem; font-size:.85rem; color:var(--muted); line-height:1.7}
.acc .body p{margin:0 0 .6rem}
.acc .body p:last-child{margin:0}

.toast{position:fixed; left:50%; bottom:5.2rem; transform:translateX(-50%); background:var(--ink); color:var(--paper);
  padding:.55rem 1rem; border-radius:99px; font-size:.82rem; z-index:60; box-shadow:0 4px 14px rgba(0,0,0,.18); max-width:88vw}
.steps{counter-reset:s; margin:0; padding:0; list-style:none}
.steps li{counter-increment:s; position:relative; padding-left:1.9rem; margin-bottom:.6rem; font-size:.86rem; line-height:1.65}
.steps li::before{content:counter(s); position:absolute; left:0; top:.1rem; width:1.3rem; height:1.3rem;
  border-radius:50%; background:var(--accent-soft); color:var(--accent-ink); font-size:.72rem; font-weight:600;
  display:grid; place-items:center; font-family:var(--mono)}
.kv{display:flex; gap:.6rem; padding:.4rem 0; font-size:.85rem; border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--muted); width:6.5rem; flex:none}
.kv .v{flex:1; min-width:0}
.pill-row{display:flex; gap:.4rem; flex-wrap:wrap}
.task{display:flex; align-items:center; gap:.65rem; padding:.5rem 0; border-bottom:1px solid var(--line); width:100%; background:none; border-left:0; border-right:0; border-top:0; text-align:left}
.task:last-child{border-bottom:0}
.task .box{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--line-strong); flex:none; display:grid; place-items:center; font-size:.75rem}
.task.done .box{background:var(--accent); border-color:transparent; color:#fff}
.task.done .lbl{color:var(--muted); text-decoration:line-through}
.task .lbl{flex:1; font-size:.88rem}
</style>

<div id="app">
  <div class="topbar" id="topbar"></div>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>
<div id="toast"></div>
