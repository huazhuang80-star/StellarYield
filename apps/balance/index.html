<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6C74">
<title>BALANCE 双向体重管理</title>
</head>
<body>
<!--APP-START-->
<style>
/* ── tokens ───────────────────────────────────────────── */
:root{
  --paper:#EDF1EE; --card:#FFFFFF; --card-2:#F6F8F6;
  --ink:#16211D; --muted:#5F6E67; --faint:#8A9791;
  --line:#D3DCD6; --line-strong:#B9C6BF;
  --accent:#1F6C74; --accent-ink:#0F3F45; --accent-soft:#DBE9E9;
  --good:#2F6D4F; --limit:#8A6A2B; --avoid:#A8382C;
  --good-bg:#E4EEE7; --limit-bg:#F3EBDA; --avoid-bg:#F6E4E1;
  --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Songti TC",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --base:15px; --r:10px;
  --shell:480px;
}
:root[data-skin="die"]{
  --paper:#EDF2F0; --card:#FFFFFF; --card-2:#F4F9F7;
  --ink:#152220; --muted:#5B6E69; --line:#D2E0DB;
  --accent:#0E7C6B; --accent-ink:#08453C; --accent-soft:#D6EBE5;
}
:root[data-skin="yang"]{
  --paper:#F0F0EA; --card:#FFFFFF; --card-2:#F7F7F1;
  --ink:#1D2118; --muted:#5F6553; --line:#D8D9CC;
  --accent:#4A6B3A; --accent-ink:#2A3F20; --accent-soft:#E2E9DA;
  --base:17px;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0E1512; --card:#161F1B; --card-2:#1C2621;
    --ink:#E6EDE8; --muted:#94A39C; --faint:#71807A;
    --line:#26332D; --line-strong:#354640;
    --accent:#63B4AF; --accent-ink:#A9D9D4; --accent-soft:#1B2F30;
    --good:#6FB78C; --limit:#C9A961; --avoid:#DE8C80;
    --good-bg:#172A20; --limit-bg:#2A2418; --avoid-bg:#2C1D1B;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1512; --card:#161F1B; --card-2:#1C2621;
  --ink:#E6EDE8; --muted:#94A39C; --faint:#71807A;
  --line:#26332D; --line-strong:#354640;
  --accent:#63B4AF; --accent-ink:#A9D9D4; --accent-soft:#1B2F30;
  --good:#6FB78C; --limit:#C9A961; --avoid:#DE8C80;
  --good-bg:#172A20; --limit-bg:#2A2418; --avoid-bg:#2C1D1B;
}
:root[data-theme="light"]{
  --paper:#EDF1EE; --card:#FFFFFF; --card-2:#F6F8F6;
  --ink:#16211D; --muted:#5F6E67; --faint:#8A9791;
  --line:#D3DCD6; --line-strong:#B9C6BF;
  --accent:#1F6C74; --accent-ink:#0F3F45; --accent-soft:#DBE9E9;
  --good:#2F6D4F; --limit:#8A6A2B; --avoid:#A8382C;
  --good-bg:#E4EEE7; --limit-bg:#F3EBDA; --avoid-bg:#F6E4E1;
}
:root[data-theme="light"][data-skin="die"]{ --accent:#0E7C6B; --accent-soft:#D6EBE5; }
:root[data-theme="light"][data-skin="yang"]{ --accent:#4A6B3A; --accent-soft:#E2E9DA; --paper:#F0F0EA; }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font:var(--base)/1.65 var(--sans);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--serif); font-weight:600; text-wrap:balance; margin:0; letter-spacing:.01em}
button{font:inherit; color:inherit; cursor:pointer}
input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important} }

/* ── shell ────────────────────────────────────────────── */
#app{max-width:var(--shell); margin:0 auto; min-height:100vh; background:var(--paper);
  display:flex; flex-direction:column; position:relative}
@media (min-width:560px){
  body{background:var(--card-2)}
  #app{border-left:1px solid var(--line); border-right:1px solid var(--line); min-height:100vh}
}
.topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  padding:.7rem 1rem; display:flex; align-items:center; gap:.7rem}
.avatar{width:38px; height:38px; border-radius:50%; background:var(--accent-soft);
  display:grid; place-items:center; font-size:20px; flex:none; border:1px solid var(--line)}
.topmeta{flex:1; min-width:0}
.topmeta b{font-family:var(--serif); font-size:.98rem; display:block; line-height:1.3}
.topmeta span{font-size:.74rem; color:var(--muted); display:block}
.chip{font-size:.7rem; padding:.16rem .5rem; border:1px solid var(--line-strong); border-radius:20px;
  color:var(--muted); white-space:nowrap; background:var(--card)}
.chip.on{background:var(--accent-soft); border-color:transparent; color:var(--accent-ink); font-weight:600}
main{flex:1; padding:1rem 1rem 5.5rem}
.tabs{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex;
  background:color-mix(in srgb, var(--paper) 94%, transparent); backdrop-filter:blur(12px);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:560px){ .tabs{max-width:var(--shell); margin:0 auto; border-left:1px solid var(--line); border-right:1px solid var(--line)} }
.tabs button{flex:1; background:none; border:0; padding:.55rem .2rem .6rem; display:grid; gap:.12rem;
  justify-items:center; color:var(--muted); font-size:.68rem; letter-spacing:.03em}
.tabs button i{font-style:normal; font-size:19px; line-height:1}
.tabs button[aria-current="page"]{color:var(--accent); font-weight:600}

/* ── primitives ───────────────────────────────────────── */
.stack{display:flex; flex-direction:column; gap:.85rem}
.row{display:flex; align-items:center; gap:.6rem}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:1rem}
.card.flat{background:var(--card-2)}
.eyebrow{font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint);
  font-family:var(--sans); font-weight:600}
.lede{color:var(--muted); font-size:.86rem; margin:.3rem 0 0}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
.btn{background:var(--accent); color:#fff; border:0; border-radius:8px; padding:.68rem 1rem;
  font-weight:600; font-size:.92rem; width:100%; transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--line-strong)}
.btn.mini{width:auto; padding:.4rem .75rem; font-size:.8rem}
.btn:disabled{opacity:.45; cursor:not-allowed}
label.field{display:block; font-size:.8rem; color:var(--muted); margin-bottom:.9rem}
label.field b{display:block; color:var(--ink); font-weight:600; margin-bottom:.3rem; font-size:.85rem}
input[type=text],input[type=number],select{width:100%; padding:.6rem .7rem; border:1px solid var(--line-strong);
  border-radius:8px; background:var(--card)}
.seg{display:flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; background:var(--card)}
.seg button{flex:1; background:none; border:0; padding:.55rem .4rem; font-size:.85rem; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff; font-weight:600}
.tag{font-size:.7rem; padding:.1rem .42rem; border-radius:4px; font-weight:600; white-space:nowrap}
.tag.good{background:var(--good-bg); color:var(--good)}
.tag.limit{background:var(--limit-bg); color:var(--limit)}
.tag.avoid{background:var(--avoid-bg); color:var(--avoid)}
.note{font-size:.76rem; color:var(--muted); line-height:1.6}
.hr{height:1px; background:var(--line); border:0; margin:.2rem 0}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}

/* ── dashboard ────────────────────────────────────────── */
.kcal{display:flex; align-items:center; gap:1rem}
.kcal .big{font-family:var(--mono); font-size:2.1rem; font-weight:600; line-height:1; font-variant-numeric:tabular-nums}
.kcal .of{color:var(--muted); font-size:.8rem}
.bar{height:7px; background:var(--card-2); border-radius:99px; overflow:hidden; border:1px solid var(--line)}
.bar>i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s}
.bar>i.over{background:var(--avoid)}
.macros{display:grid; grid-template-columns:repeat(3,1fr); gap:.5rem; margin-top:.8rem}
.macro{background:var(--card-2); border-radius:8px; padding:.5rem .6rem}
.macro span{font-size:.7rem; color:var(--muted); display:block}
.macro b{font-family:var(--mono); font-size:.95rem; font-variant-numeric:tabular-nums}
.meal{display:flex; gap:.7rem; align-items:flex-start; padding:.6rem 0; border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.meal .slot{font-size:.7rem; color:var(--faint); width:2.4rem; flex:none; padding-top:.15rem}
.meal .body{flex:1; min-width:0}
.meal .body b{font-weight:600; font-size:.9rem}
.meal .kc{font-family:var(--mono); font-size:.85rem; color:var(--muted); flex:none; font-variant-numeric:tabular-nums}
.del{background:none; border:0; color:var(--faint); padding:.1rem .3rem; font-size:1rem; line-height:1}

/* ── quiz ─────────────────────────────────────────────── */
.q{border:1px solid var(--line); border-radius:var(--r); padding:.9rem; background:var(--card); margin-bottom:.7rem}
.q p{margin:0 0 .6rem; font-size:.92rem; line-height:1.5}
.q .qn{font-family:var(--mono); color:var(--faint); font-size:.75rem; margin-right:.4rem}
.likert{display:grid; grid-template-columns:repeat(5,1fr); gap:.3rem}
.likert button{background:var(--card-2); border:1px solid var(--line); border-radius:6px;
  padding:.45rem .1rem; font-size:.68rem; color:var(--muted); line-height:1.25}
.likert button[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:transparent; font-weight:600}
.progress{position:sticky; top:56px; z-index:10; background:var(--paper); padding:.5rem 0 .7rem}

/* ── radar / chart ────────────────────────────────────── */
svg.chart{display:block; width:100%; height:auto; overflow:visible}
.legend{display:flex; flex-wrap:wrap; gap:.3rem .7rem; font-size:.75rem; color:var(--muted)}
.scorerow{display:flex; align-items:center; gap:.5rem; font-size:.82rem; padding:.22rem 0}
.scorerow .nm{width:3.6rem; flex:none}
.scorerow .tr{flex:1; height:6px; background:var(--card-2); border-radius:99px; border:1px solid var(--line); overflow:hidden}
.scorerow .tr>i{display:block; height:100%; background:var(--accent)}
.scorerow .vl{width:2.3rem; text-align:right; font-family:var(--mono); font-size:.78rem; flex:none}

/* ── SOS ──────────────────────────────────────────────── */
.sos-ring{display:grid; place-items:center; margin:.5rem auto 1rem}
.sos-ring .t{font-family:var(--mono); font-size:2.6rem; font-weight:600; font-variant-numeric:tabular-nums}
.sos-ring .l{font-size:.75rem; color:var(--muted)}
.choices{display:grid; gap:.5rem}
.choice{text-align:left; background:var(--card); border:1px solid var(--line-strong); border-radius:8px;
  padding:.7rem .85rem; font-size:.88rem}
.choice[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.choice b{display:block; font-size:.9rem}
.choice span{font-size:.76rem; color:var(--muted)}

/* ── misc ─────────────────────────────────────────────── */
.badges{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:.6rem}
.badge{text-align:center; padding:.7rem .3rem; border:1px solid var(--line); border-radius:var(--r);
  background:var(--card-2); opacity:.42}
.badge.got{opacity:1; background:var(--card); border-color:var(--accent)}
.badge i{font-style:normal; font-size:22px; display:block; line-height:1.4}
.badge span{font-size:.7rem; display:block; line-height:1.3}
.foodrow{display:flex; align-items:center; gap:.6rem; padding:.55rem 0; border-bottom:1px solid var(--line)}
.foodrow:last-child{border-bottom:0}
.foodrow .nm{flex:1; min-width:0; font-size:.9rem}
.foodrow .nm small{display:block; color:var(--muted); font-size:.72rem; font-family:var(--mono)}
.warn{background:var(--limit-bg); border:1px solid color-mix(in srgb,var(--limit) 35%, transparent);
  border-radius:var(--r); padding:.75rem .85rem; font-size:.82rem; line-height:1.6}
.danger{background:var(--avoid-bg); border:1px solid color-mix(in srgb,var(--avoid) 35%, transparent);
  border-radius:var(--r); padding:.85rem; font-size:.85rem; line-height:1.65}
.disclaim{font-size:.72rem; color:var(--faint); line-height:1.6; padding:.5rem 0 1rem}
.empty{text-align:center; color:var(--muted); font-size:.85rem; padding:1.5rem .5rem}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:.6rem}
.stat{background:var(--card-2); border:1px solid var(--line); border-radius:8px; padding:.6rem .7rem}
.stat span{font-size:.7rem; color:var(--muted); display:block}
.stat b{font-family:var(--mono); font-size:1.15rem; font-variant-numeric:tabular-nums; font-weight:600}
</style>

<div id="app">
  <div class="topbar" id="topbar"></div>
  <main id="main"></main>
  <nav class="tabs" id="tabs"></nav>
</div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════
   BALANCE — 双向体重管理
   知体 · 调心 · 正食 · 平衡
   本文件为完整可运行原型，无外部依赖，数据存于 localStorage。
   ══════════════════════════════════════════════════════════ */

/* ── 九种体质 ─────────────────────────────────────────── */
const TYPES = {
  pinghe:{n:"平和质", feat:["面色红润有光泽","精力充沛、睡眠良好","对气候环境适应力强"],
    loss:"你的底子好。体重管理只需守住规律三餐和活动量，不要为了求快去做极端节食 —— 那反而会把好体质耗掉。",
    gain:"你的底子好。增重靠稳定的热量盈余加力量训练即可，不需要特殊调理。",
    ex:"任何你能长期坚持的运动都合适，每周 3–5 次。", drink:"温水、淡茶。"},
  qixu:{n:"气虚质", feat:["容易疲劳、气短懒言","稍动就出汗","容易感冒，抵抗力偏弱"],
    loss:"你不是吃太多，是气不足带不动代谢。节食会让气更虚、越减越没力气。先把三餐吃稳、把觉睡够，再谈减量。",
    gain:"气虚是增重的常见底色 —— 不是吃不胖，是脾胃没力气把食物变成身体。少食多餐、把食物做软烂好消化，比硬塞更有效。",
    ex:"八段锦、散步、慢速力量训练。避免练到大汗淋漓，那会更耗气。", drink:"黄芪水、红枣枸杞茶。忌浓茶。"},
  yangxu:{n:"阳虚质", feat:["怕冷，手脚常年发凉","喜热饮热食","精神不振，容易腹泻"],
    loss:"沙拉和冰饮对你是负担 —— 阳气不足，生冷会让运化更慢，水湿更容易堆积。把菜做熟做温，比吃生更能瘦。",
    gain:"阳虚的人吃下去不容易吸收。饭菜要温热，晚上别吃凉的，早睡养阳，体重才能稳住。",
    ex:"晒背、快走、太极。避免清晨空腹在寒风里运动。", drink:"姜枣茶、桂圆红茶。忌冰饮、冷啤酒。"},
  yinxu:{n:"阴虚质", feat:["口干咽干，手足心热","容易失眠、大便偏干","性情急躁，容易上火"],
    loss:"辛辣、烧烤、油炸会加重你的燥。清淡滋润的做法既降火也降热量，方向是一致的。",
    gain:"阴虚的人容易吃了就上火、越吃越瘦。增重要走滋润路线：银耳、山药、蛋奶，避开烤炸辣。",
    ex:"游泳、瑜伽、傍晚散步。避免正午暴晒下的高强度运动。", drink:"银耳汤、百合莲子、雪梨水。忌咖啡过量、辛辣。"},
  tanshi:{n:"痰湿质", feat:["体型偏胖，腹部肥满松软","面部油脂多，容易困倦","痰多，身重不爽，喜食肥甘"],
    loss:"你的胖不是“吃得多”，是“运化差”—— 脾胃化不掉水湿，就堆成了脂肪。单纯饿着会进一步伤脾，越减越虚。先祛湿、把主食换成杂粮，比数卡路里管用。",
    gain:"痰湿体质本就偏胖，如果你仍想增重，要增的是肌肉不是湿。以蛋白质和力量训练为主，避开甜腻。",
    ex:"八段锦、快走、游泳。出微汗即可，忌大汗伤阳。", drink:"荷叶茶、陈皮普洱、红豆薏米水。忌含糖饮料。"},
  shire:{n:"湿热质", feat:["面部油腻易长痘","口苦口干，大便黏滞不爽","小便偏黄，身重困倦"],
    loss:"烧烤配啤酒是你的雷区。清热利湿的吃法会同时改善痘和体重 —— 这两件事是一个原因。",
    gain:"先把湿热清一清再谈增重，否则增的多是负担。以清淡优质蛋白为主。",
    ex:"游泳、快走、球类。运动后及时擦汗更衣，别让汗湿黏着。", drink:"绿豆汤、苦瓜茶、菊花茶。忌酒、忌甜饮。"},
  xueyu:{n:"血瘀质", feat:["面色偏暗，容易有瘀斑","口唇偏暗，皮肤干燥","容易忘事，情绪不畅"],
    loss:"血行不畅的人光靠少吃效果差，运动带来的活血比节食更关键。",
    gain:"增重同时要活血，否则营养送不到该去的地方。规律运动配合优质蛋白。",
    ex:"任何能让你微微出汗、心跳加快的运动，规律比强度重要。", drink:"山楂茶、玫瑰花茶、红糖姜茶。"},
  qiyu:{n:"气郁质", feat:["情绪低落，容易多愁善感","胸闷、喜叹气","咽中似有异物，睡眠浅"],
    loss:"你的进食多半和情绪绑在一起 —— 不是嘴馋，是情绪找不到出口。先处理情绪，食欲会自己回落。工具页的“冲动急救”对你最有用。",
    gain:"气郁的人一紧张就吃不下。把吃饭环境弄轻松、别边吃边看工作消息，比强迫自己多吃有效。",
    ex:"户外有氧、跑步、跳舞、集体运动。晒太阳对你格外重要。", drink:"陈皮水、佛手柑茶、茉莉花茶。"},
  tebing:{n:"特禀质", feat:["容易过敏，起疹打喷嚏","对季节变化、气味、食物敏感","皮肤划痕后易发红"],
    loss:"你的重点不是热量，是找出并避开让你过敏的食物 —— 过敏引起的水肿常被误当成胖。",
    gain:"增重要在不诱发过敏的前提下扩大食物范围，逐样试、慢慢加。",
    ex:"温和规律的运动。花粉季减少户外。", drink:"温水为主。慎用蜂蜜、花类茶。"}
};
const TID = Object.keys(TYPES);
const BIAS = TID.filter(t=>t!=="pinghe");

/* ── 体质测评（30 题，简版量表）────────────────────────
   计分参照《中医体质分类与判定》的转化分算法：
   转化分 =(原始分 - 条目数)/(条目数×4)×100
   判定：平和质≥60 且偏颇均<30 → 平和；偏颇≥40 是，30–39 倾向。
   注意：这是缩短版，仅供自我了解，不是标准量表本身。      */

function advise(food, cid){
  const r = RULES[cid] || RULES.pinghe;
  if(r.avoid(food)) return {lv:"avoid", t:"忌", why:r.why.avoid};
  if(r.limit(food)) return {lv:"limit", t:"少", why:r.why.limit};
  if(r.good(food))  return {lv:"good",  t:"宜", why:r.why.good};
  return null;
}

    for(const k in S.logs) for(const m of S.logs[k].meals) if(m.photo){ delete m.photo; dropped++; }
    try{
      localStorage.setItem(KEY, JSON.stringify(S));
      if(dropped) alert("本机存储已满，已清除 "+dropped+" 张餐食照片以保住记录数据。文字记录都还在。");
    }catch(e2){ alert("本机存储已满，这次改动没能保存。可以到「我的」导出后清空数据。"); }
  }
}
function today(){ const d=new Date(); return ymd(d); }
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayLog(k){ k=k||today(); if(!S.logs[k]) S.logs[k]={meals:[],impulses:[]}; return S.logs[k]; }
function loggedDays(s){ return Object.keys(s.logs).filter(k=>(s.logs[k].meals||[]).length>0).sort(); }
function totalMeals(s){ return loggedDays(s).reduce((n,k)=>n+s.logs[k].meals.length,0); }
function allImpulses(s){ return Object.keys(s.logs).flatMap(k=>s.logs[k].impulses||[]); }
function streak(s){
  const set=new Set(loggedDays(s)); let n=0; const d=new Date();
  for(;;){ if(set.has(ymd(d))){ n++; d.setDate(d.getDate()-1); } else break; }
  return n;
}
function daysSinceStart(){
  const a=new Date(S.profile.start+"T00:00:00"), b=new Date(today()+"T00:00:00");
  return Math.max(0, Math.round((b-a)/864e5));
}
function daysFollowingConstitution(s){
  if(!s.constitution.done) return 0;
  const cid=s.constitution.primary;
  return loggedDays(s).filter(k=>{
    const ms=s.logs[k].meals; if(!ms.length) return false;
    return !ms.some(m=>{ const f=FOODS[m.fi]; return f && (advise(f,cid)||{}).lv==="avoid"; });
  }).length;
}
function reachedGoal(s){
  const ws=Object.keys(s.weights).sort(); if(!ws.length) return false;
  const w=s.weights[ws[ws.length-1]], t=s.profile.target;
  return s.profile.mode==="loss" ? w<=t : w>=t;
}

/* ══ 计算 ══════════════════════════════════════════════ */
function bmi(w,h){ return w/Math.pow(h/100,2); }
function bmr(p){
  const b=10*p.weight+6.25*p.height-5*p.age;
  return p.sex==="male"? b+5 : b-161;
}
function tdee(p){ return bmr(p)*p.activity; }
/* 目标热量：减脂 -20% 但设下限；增重 +15% */
function targetKcal(p){
  const t=tdee(p);
  if(p.mode==="gain") return Math.round(t*1.15);
  const floor=Math.max(bmr(p)*1.1, p.sex==="male"?1500:1200);
  return Math.round(Math.max(t*0.8, floor));
}
function macroTargets(p){
  const k=targetKcal(p);
  const r = p.mode==="loss" ? [0.30,0.40,0.30] : [0.25,0.50,0.25];
  return { p:Math.round(k*r[0]/4), c:Math.round(k*r[1]/4), f:Math.round(k*r[2]/9), kcal:k };
}
function dayTotals(k){
  const t={kcal:0,p:0,c:0,f:0};
  for(const m of dayLog(k).meals){ t.kcal+=m.kcal; t.p+=m.p; t.c+=m.c; t.f+=m.f; }
  for(const x in t) t[x]=Math.round(t[x]);
  return t;
}
/* 转化分 */
function scoreQuiz(ans){
  const raw={}, cnt={};
  QUIZ.forEach((q,i)=>{ const t=q[1]; raw[t]=(raw[t]||0)+(ans[i]||1); cnt[t]=(cnt[t]||0)+1; });
  const out={};
  for(const t of TID) out[t]=Math.round(((raw[t]-cnt[t])/(cnt[t]*4))*100);
  return out;
}
function judge(sc){
  const biasMax=Math.max(...BIAS.map(t=>sc[t]));
  if(sc.pinghe>=60 && biasMax<30) return {primary:"pinghe", tend:[]};
  const yes=BIAS.filter(t=>sc[t]>=40).sort((a,b)=>sc[b]-sc[a]);
  const tend=BIAS.filter(t=>sc[t]>=30&&sc[t]<40).sort((a,b)=>sc[b]-sc[a]);
  if(yes.length) return {primary:yes[0], tend:yes.slice(1).concat(tend)};
  if(tend.length) return {primary:tend[0], tend:tend.slice(1)};
  return {primary:"pinghe", tend:[]};
}

function weightChart(){
  const ks=Object.keys(S.weights).sort();
  if(ks.length<2) return `<p class="note" style="margin-top:.5rem">记录 2 天以上就会出现趋势线。</p>`;
  const vs=ks.map(k=>S.weights[k]);
  const mn=Math.min(...vs)-.5, mx=Math.max(...vs)+.5, W=300,H=80;
  const pts=vs.map((v,i)=>[(i/(vs.length-1))*W, H-((v-mn)/(mx-mn))*H]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L${W} ${H} L0 ${H} Z`;
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="-4 -6 ${W+8} ${H+16}" role="img"
      aria-label="体重趋势，从 ${vs[0]} 到 ${vs[vs.length-1]} 公斤">
    <path d="${area}" fill="var(--accent)" opacity=".1"></path>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"></path>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="var(--accent)"></circle>
    <text x="${W}" y="${H+12}" text-anchor="end" font-size="9" fill="var(--muted)"
      font-family="var(--mono)">${vs[vs.length-1]} kg</text>
    <text x="0" y="${H+12}" font-size="9" fill="var(--muted)" font-family="var(--mono)">${vs[0]} kg</text>
  </svg>`;
}

function radar(sc){
  const R=68, C=90, n=TID.length;
  const pt=(i,r)=>{ const a=-Math.PI/2+i*2*Math.PI/n; return [C+Math.cos(a)*r, C+Math.sin(a)*r]; };
  const ring=(f)=>TID.map((_,i)=>pt(i,R*f)).map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const shape=TID.map((t,i)=>pt(i,R*Math.max(4,sc[t])/100)).map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  return `<svg class="chart" viewBox="0 0 180 190" role="img" aria-label="九种体质转化分雷达图">
    ${[.25,.5,.75,1].map(f=>`<polygon points="${ring(f)}" fill="none" stroke="var(--line)" stroke-width=".8"></polygon>`).join("")}
    ${TID.map((_,i)=>{const p=pt(i,R);return `<line x1="${C}" y1="${C}" x2="${p[0].toFixed(1)}" y2="${p[1].toFixed(1)}" stroke="var(--line)" stroke-width=".8"></line>`;}).join("")}
    <polygon points="${shape}" fill="var(--accent)" fill-opacity=".22" stroke="var(--accent)" stroke-width="1.6"></polygon>
    ${TID.map((t,i)=>{const p=pt(i,R+13);return `<text x="${p[0].toFixed(1)}" y="${(p[1]+3).toFixed(1)}" font-size="8.5"
      text-anchor="middle" fill="var(--muted)">${TYPES[t].n.replace("质","")}</text>`;}).join("")}
  </svg>`;
}

        <div class="nm"><b>${h(x[0])}</b><small style="font-family:var(--sans); font-size:.78rem">${h(x[1])}</small></div>
      </div>`).join("")}</div>

/* ══ 外壳 ══════════════════════════════════════════════ */
const TABS=[["today","☰","今日"],["log","＋","记录"],["body","☯","体质"],["tools","◇","工具"],["me","●","我的"]];
function render(){
  document.documentElement.dataset.skin=S.skin;
  const onboarding = !S.onboarded;
  const flagged = S.screen.done && S.screen.flagged && !S.onboarded;

  if(onboarding){
    $("topbar").style.display="none"; $("tabs").style.display="none";
    $("main").innerHTML = flagged? viewFlagged() : viewOnboard();
    $("main").style.paddingBottom="2rem";
    return;
  }
  $("topbar").style.display=""; $("tabs").style.display=""; $("main").style.paddingBottom="";
  const st=stageOf(S.profile.mode, daysSinceStart());
  $("topbar").innerHTML=`
    <div class="avatar" aria-hidden="true">${st[1]}</div>
    <div class="topmeta"><b>${h(st[2])}</b><span>连续 ${streak(S)} 天 · ${h(currentTerm(new Date())[2])}</span></div>
    <span class="chip on">${S.profile.mode==="loss"?"减脂":"增重"}</span>
    ${S.constitution.done?`<span class="chip">${h(TYPES[S.constitution.primary].n)}</span>`:""}`;
  $("tabs").innerHTML=TABS.map(t=>`<button data-act="tab" data-v="${t[0]}"
    ${S.tab===t[0]?'aria-current="page"':""}><i>${t[1]}</i>${t[2]}</button>`).join("");
  const V={today:viewToday, log:viewLog, body:viewBody, tools:viewTools, me:viewMe};
  $("main").innerHTML=(V[S.tab]||viewToday)();
  if(S.tab==="log"){ const el=$("q"); if(el){ el.oninput=e=>{ q=e.target.value; renderSoft(); }; } }
}
function renderSoft(){
  const V={today:viewToday, log:viewLog, body:viewBody, tools:viewTools, me:viewMe};
  const el=$("q"), pos=el?el.selectionStart:null;
  $("main").innerHTML=(V[S.tab]||viewToday)();
  if(S.tab==="log"){ const n=$("q"); if(n){ n.oninput=e=>{ q=e.target.value; renderSoft(); };
    n.focus(); if(pos!=null) n.setSelectionRange(pos,pos); } }
}

/* ══ 交互 ══════════════════════════════════════════════ */
document.addEventListener("click", (e)=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act, v=t.dataset.v, i=+t.dataset.i;

  switch(a){
    case "mode": S.profile.mode=v; save(); render(); break;
    case "mode2": S.profile.mode=v; save(); render(); break;
    case "step": S.step=+v; save(); render(); break;
    case "sex": S.profile.sex=v; save(); render(); break;
    case "skin": S.skin=v; save(); render(); break;
    case "tab": go(v); break;
    case "slot": slot=v; renderSoft(); break;

    case "saveProfile": {
      const p=S.profile;
      p.age=clamp(+$("f-age").value,14,90); p.height=clamp(+$("f-h").value,120,220);
      p.weight=clamp(+$("f-w").value,30,250); p.target=clamp(+$("f-t").value,30,250);
      p.activity=+$("f-act").value;
      S.step=2; save(); render(); break;
    }
    case "scoff": { S.screen.a=S.screen.a||[]; S.screen.a[i]=+v; save(); render(); break; }
    case "scoffDone": {
      const arr=S.screen.a||[];
      if(arr.filter(x=>x!=null).length<5){ alert("还有问题没回答。"); break; }
      S.screen.done=true; S.screen.yes=arr.filter(x=>x===1).length;
      S.screen.flagged=S.screen.yes>=2;
      if(!S.screen.flagged){ S.onboarded=true; S.profile.start=today(); }
      save(); render(); break;
    }
    case "enterSafe": S.onboarded=true; S.profile.start=today(); save(); render(); break;
    case "unflag": S.screen.flagged=false; S.onboarded=true; S.profile.start=today(); save(); render(); break;
    case "toggleNumbers": S.screen.flagged=!S.screen.flagged; save(); render(); break;

    case "ans": S.quizAns[i]=+v; save(); renderSoft(); break;
    case "finishQuiz": {
      const sc=scoreQuiz(S.quizAns), j=judge(sc);
      S.constitution={done:true, scores:sc, primary:j.primary, tend:j.tend};
      save(); render(); window.scrollTo(0,0); break;
    }
    case "requiz": S.quizAns=[]; S.constitution={done:false,scores:{},primary:null,tend:[]}; save(); render(); break;
    case "dropPhoto": pendingPhoto=null; renderSoft(); break;

    case "add": {
      const f=FOODS[i], g=clamp(+document.querySelector(`.g[data-i="${i}"]`).value,1,2000);
      const k=g/100;
      const rec={fi:i, slot, g, home:true, kcal:f[1]*k, p:f[2]*k, c:f[3]*k, f:f[4]*k};
      if(pendingPhoto){ rec.photo=pendingPhoto; pendingPhoto=null; }
      dayLog().meals.push(rec);
      save(); go("today"); window.scrollTo(0,0); break;
    }
    case "delMeal": dayLog().meals.splice(i,1); save(); render(); break;
    case "logWeight": {
      const w=+$("w-in").value; if(!w){ break; }
      S.weights[today()]=clamp(w,25,300); S.profile.weight=clamp(w,25,300); save(); render(); break;
    }
    case "setCost": S.costPerMeal=clamp(+$("cost").value,5,500); save(); render(); break;
    case "saveMe": {
      const p=S.profile;
      p.weight=clamp(+$("m-w").value,30,250); p.target=clamp(+$("m-t").value,30,250);
      p.age=clamp(+$("m-age").value,14,90); p.height=clamp(+$("m-h").value,120,220);
      p.activity=+$("m-act").value; save(); render(); break;
    }
    case "export": {
      const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
      const u=URL.createObjectURL(blob), l=document.createElement("a");
      l.href=u; l.download="balance-data.json"; l.click(); URL.revokeObjectURL(u); break;
    }
    case "reset": if(confirm("清空全部数据？无法恢复。")){ S=structuredClone(BLANK); save(); render(); } break;

    case "sosStart": S.sos={step:1, emo:null}; S.tab="tools"; save(); render(); window.scrollTo(0,0); break;
    case "sosStep": {
      S.sos.step=+v;
      if(+v===3){ S.sos.until=Date.now()+15*60000; startTick(); }
      save(); render(); window.scrollTo(0,0); break;
    }
    case "sosEmo": S.sos.emo=i; save(); render(); break;
    case "sosHungry": {
      dayLog().impulses.push({t:Date.now(), physical:true, resolved:true});
      S.sos=null; save(); go("log"); break;
    }
    case "sosEnd": {
      dayLog().impulses.push({t:Date.now(), emo:S.sos.emo, resolved:v==="1"});
      S.sos=null; stopTick(); save(); render(); window.scrollTo(0,0); break;
    }
  }
});
function clamp(n,a,b){ n=+n; if(!isFinite(n)) return a; return Math.min(b,Math.max(a,n)); }

let tick=null;
function startTick(){ stopTick(); tick=setInterval(()=>{ if(S.sos&&S.sos.step===3) render(); else stopTick(); },1000); }
function stopTick(){ if(tick){ clearInterval(tick); tick=null; } }

/* 照片压到最长边 320px 再转 JPEG —— 原图 base64 会几张就撑爆 localStorage。 */
document.addEventListener("change",(e)=>{
  if(e.target.id!=="cam" || !e.target.files || !e.target.files[0]) return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const m=320, sc=Math.min(1, m/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      pendingPhoto=cv.toDataURL("image/jpeg",.7);
      renderSoft();
    };
    img.onerror=()=>alert("这张图片读不出来，换一张试试。");
    img.src=r.result;
  };
  r.readAsDataURL(e.target.files[0]);
});

if(S.sos&&S.sos.step===3) startTick();
render();
</script>
