<title>Reborn 重生 · 系统性康复</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Reborn 重生：基于认知重塑、能量提升与冲动脱敏的系统性成瘾康复应用。">

<style>
/* ============================================================
   Reborn — 设计令牌
   深空墨 / 深空蓝 / 翡翠绿 / 琥珀金 / 朱砂红
   中性色带青绿偏，非纯灰
   ============================================================ */
:root{
  --ink:#0B1220;
  --ground:#0F172A;
  --jade:#10B981;
  --jade-dim:#0E9F6E;
  --amber:#F59E0B;
  --cinnabar:#E2503F;

  /* 语义色（与强调色分离） */
  --ok:#10B981;
  --warn:#F59E0B;
  --crit:#E2503F;

  /* 浅色主题（默认） */
  --bg:#F2F5F3;
  --surface:#FFFFFF;
  --surface-2:#E9EFEC;
  --line:#D3DEDA;
  --text:#0B1220;
  --text-2:#4A5C56;
  --text-3:#6B7F78;
  --accent:#0E8F68;
  --accent-soft:#D6F0E6;
  --gold:#B8760A;
  --gold-soft:#FBEBCF;
  --danger:#C33F2F;
  --danger-soft:#FADFDB;
  --shadow:0 1px 2px rgba(11,18,32,.06), 0 8px 24px -12px rgba(11,18,32,.18);
  --shadow-lg:0 2px 4px rgba(11,18,32,.08), 0 24px 48px -20px rgba(11,18,32,.28);

  --font-display:"Songti SC","Noto Serif CJK SC","Source Han Serif SC","Source Han Serif CN",SimSun,"STSong",Georgia,serif;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;

  --r-sm:8px; --r:14px; --r-lg:20px; --r-xl:28px;
  --shell:440px;
}

@media (prefers-color-scheme:dark){
  :root{
    --bg:#0B1220;
    --surface:#0F172A;
    --surface-2:#16233C;
    --line:#22314C;
    --text:#EAF2EF;
    --text-2:#A8BCB5;
    --text-3:#7B9188;
    --accent:#10B981;
    --accent-soft:#0F3A2C;
    --gold:#F59E0B;
    --gold-soft:#3D2C08;
    --danger:#F2705C;
    --danger-soft:#3D1712;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#0F172A; --surface-2:#16233C; --line:#22314C;
  --text:#EAF2EF; --text-2:#A8BCB5; --text-3:#7B9188;
  --accent:#10B981; --accent-soft:#0F3A2C; --gold:#F59E0B; --gold-soft:#3D2C08;
  --danger:#F2705C; --danger-soft:#3D1712;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 4px rgba(0,0,0,.5), 0 24px 48px -20px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E9EFEC; --line:#D3DEDA;
  --text:#0B1220; --text-2:#4A5C56; --text-3:#6B7F78;
  --accent:#0E8F68; --accent-soft:#D6F0E6; --gold:#B8760A; --gold-soft:#FBEBCF;
  --danger:#C33F2F; --danger-soft:#FADFDB;
  --shadow:0 1px 2px rgba(11,18,32,.06), 0 8px 24px -12px rgba(11,18,32,.18);
  --shadow-lg:0 2px 4px rgba(11,18,32,.08), 0 24px 48px -20px rgba(11,18,32,.28);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--font-body);
  font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}

/* ============ APP SHELL ============ */
.shell{
  max-width:var(--shell); margin:0 auto; min-height:100vh;
  min-height:100dvh; position:relative;
  background:var(--bg);
  display:flex; flex-direction:column;
}
@media (min-width:600px){
  body{background:linear-gradient(160deg,var(--surface-2),var(--bg))}
  .shell{
    box-shadow:var(--shadow-lg);
    min-height:100dvh;
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }
}

/* 顶栏 */
.topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:10px;
  padding:14px 18px 12px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.brand{
  font-family:var(--font-display); font-size:19px; font-weight:600;
  letter-spacing:.06em; margin:0; flex:1;
}
.brand span{color:var(--accent)}
.chip{
  display:inline-flex; align-items:center; gap:5px;
  padding:5px 10px; border-radius:999px;
  background:var(--surface); border:1px solid var(--line);
  font-size:12.5px; font-variant-numeric:tabular-nums;
  font-weight:600;
}
.chip.gold{color:var(--gold); background:var(--gold-soft); border-color:transparent}
.icon-btn{
  display:grid; place-items:center; width:34px; height:34px;
  border-radius:10px; border:1px solid var(--line);
  background:var(--surface); padding:0;
}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* 主内容 */
.main{flex:1; padding:18px 18px 108px; display:none}
.main.active{display:block}

/* 底部导航 */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  max-width:var(--shell); margin:0 auto;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.tab{
  display:flex; flex-direction:column; align-items:center; gap:3px;
  background:none; border:0; padding:6px 2px; border-radius:12px;
  color:var(--text-3); font-size:10.5px; letter-spacing:.04em;
  transition:color .18s;
}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--accent)}
.tab[aria-selected="true"] .tab-dot{opacity:1}
.tab-dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:0;transition:opacity .18s}

/* 急救悬浮按钮 */
.sos{
  position:fixed; z-index:55;
  bottom:calc(78px + env(safe-area-inset-bottom)); right:calc(50% - var(--shell)/2 + 18px);
  display:flex; align-items:center; gap:7px;
  padding:11px 16px; border-radius:999px; border:0;
  background:var(--cinnabar); color:#fff;
  font-size:13.5px; font-weight:700; letter-spacing:.03em;
  box-shadow:0 6px 20px -6px rgba(226,80,63,.7);
}
@media (max-width:479px){ .sos{right:18px} }
.sos:hover{filter:brightness(1.08)}
.sos svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}

/* ============ 排版 ============ */
.h-display{
  font-family:var(--font-display); font-weight:600;
  font-size:26px; line-height:1.3; margin:0 0 6px;
  text-wrap:balance; letter-spacing:.01em;
}
.h-sec{
  font-family:var(--font-display); font-size:17px; font-weight:600;
  margin:26px 0 12px; display:flex; align-items:baseline; gap:9px;
  letter-spacing:.02em;
}
.h-sec::after{content:"";flex:1;height:1px;background:var(--line)}
.eyebrow{
  font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-3); font-weight:600; margin:0 0 8px;
}
.lede{color:var(--text-2); margin:0 0 14px; max-width:34em}
.small{font-size:12.5px; color:var(--text-3); line-height:1.6}
.num{font-family:var(--font-mono); font-variant-numeric:tabular-nums}

/* ============ 卡片 ============ */
.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:16px;
  box-shadow:var(--shadow);
}
.card + .card{margin-top:12px}
.stack{display:flex; flex-direction:column; gap:12px}
.row{display:flex; align-items:center; gap:12px}
.row-between{display:flex; align-items:center; justify-content:space-between; gap:12px}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}

/* 天数英雄卡 */
.hero{
  position:relative; overflow:hidden;
  background:linear-gradient(150deg,var(--ground),#132A45 60%,#0F3A2C);
  border:1px solid rgba(16,185,129,.22);
  border-radius:var(--r-lg); padding:22px 20px 20px;
  color:#EAF2EF;
}
.hero::before{
  content:""; position:absolute; inset:-40% -20% auto auto;
  width:280px; height:280px; border-radius:50%;
  background:radial-gradient(circle,rgba(16,185,129,.28),transparent 68%);
  pointer-events:none;
}
.hero-label{font-size:11.5px; letter-spacing:.15em; text-transform:uppercase; color:rgba(234,242,239,.62); margin:0 0 2px}
.hero-days{
  font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  font-size:58px; line-height:1; font-weight:700;
  letter-spacing:-.03em; margin:2px 0 0;
  background:linear-gradient(180deg,#fff,#8FE8C8);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.hero-unit{font-family:var(--font-body);font-size:15px;color:rgba(234,242,239,.7);margin-left:7px;font-weight:400}
.hero-meta{display:flex; gap:18px; margin-top:14px; padding-top:14px; border-top:1px solid rgba(234,242,239,.14)}
.hero-meta div{flex:1}
.hero-meta dt{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:rgba(234,242,239,.55); margin:0}
.hero-meta dd{margin:3px 0 0; font-family:var(--font-mono); font-size:16px; font-weight:600; font-variant-numeric:tabular-nums}

/* 伙伴（动物） */
.pet-stage{
  position:relative; display:grid; place-items:center;
  padding:18px 0 6px;
}
.pet-glyph{
  font-size:76px; line-height:1;
  filter:drop-shadow(0 8px 18px rgba(16,185,129,.32));
  animation:breathe 4.2s ease-in-out infinite;
}
.pet-glyph.sad{filter:grayscale(.7) drop-shadow(0 6px 14px rgba(0,0,0,.3)); animation-duration:7s}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.035)}}
.pet-ring{
  position:absolute; inset:auto; width:132px; height:132px; border-radius:50%;
  border:1px dashed color-mix(in srgb,var(--accent) 45%, transparent);
  animation:spin 26s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* 进度条 */
.bar{height:7px; border-radius:999px; background:var(--surface-2); overflow:hidden}
.bar > i{display:block; height:100%; border-radius:999px; background:var(--accent); transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.gold > i{background:var(--gold)}
.bar.crit > i{background:var(--danger)}
.stat-line{display:grid; grid-template-columns:64px 1fr 42px; align-items:center; gap:10px; font-size:12.5px}
.stat-line b{font-weight:600; color:var(--text-2)}
.stat-line span{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--text-3)}

/* 任务项 */
.task{
  display:flex; align-items:flex-start; gap:12px;
  padding:13px 14px; border-radius:var(--r);
  background:var(--surface); border:1px solid var(--line);
  width:100%; text-align:left; transition:border-color .18s, background .18s;
}
.task:hover{border-color:color-mix(in srgb,var(--accent) 40%, var(--line))}
.task.done{background:var(--accent-soft); border-color:transparent}
.task.done .task-name{text-decoration:line-through; color:var(--text-3)}
.tick{
  flex:none; width:21px; height:21px; border-radius:6px; margin-top:1px;
  border:1.8px solid var(--text-3); display:grid; place-items:center;
  transition:.18s;
}
.task.done .tick{background:var(--accent); border-color:var(--accent)}
.tick svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.task.done .tick svg{opacity:1}
.task-body{flex:1; min-width:0}
.task-name{font-weight:600; font-size:14.5px; display:block}
.task-note{font-size:12px; color:var(--text-3); display:block; margin-top:2px}
.task-coin{flex:none; font-size:11.5px; font-weight:700; color:var(--gold); font-family:var(--font-mono)}

.time-group{margin-top:14px}
.time-head{
  display:flex; align-items:center; gap:8px; margin-bottom:9px;
  font-size:12px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-3); font-weight:600;
}
.time-head::after{content:"";flex:1;height:1px;background:var(--line)}

/* 按钮 */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:12px 18px; border-radius:var(--r-sm); border:1px solid transparent;
  background:var(--accent); color:#fff; font-weight:650; font-size:14.5px;
  transition:filter .18s, transform .1s;
}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--surface); color:var(--text); border-color:var(--line)}
.btn.ghost:hover{background:var(--surface-2); filter:none}
.btn.danger{background:var(--cinnabar)}
.btn.gold{background:var(--gold); color:#1A1204}
.btn.block{width:100%}
.btn:disabled{opacity:.42; cursor:not-allowed}
.btn-row{display:flex; gap:9px; flex-wrap:wrap}

/* 徽章/标签 */
.pill{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:650;
  background:var(--surface-2); color:var(--text-2);
}
.pill.ok{background:var(--accent-soft); color:var(--accent)}
.pill.warn{background:var(--gold-soft); color:var(--gold)}
.pill.crit{background:var(--danger-soft); color:var(--danger)}

/* 预警卡 */
.alert{
  border-radius:var(--r); padding:14px 15px;
  background:var(--gold-soft); border:1px solid color-mix(in srgb,var(--gold) 30%, transparent);
}
.alert.crit{background:var(--danger-soft); border-color:color-mix(in srgb,var(--danger) 30%, transparent)}
.alert-title{font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:7px; margin-bottom:5px}
.alert-title svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.alert p{margin:0; font-size:13px; color:var(--text-2); line-height:1.6}

/* ============ 模态 ============ */
.sheet{
  position:fixed; inset:0; z-index:100;
  background:var(--bg);
  display:none; flex-direction:column;
  max-width:var(--shell); margin:0 auto;
}
.sheet.open{display:flex; animation:sheetUp .28s cubic-bezier(.2,.9,.25,1)}
@keyframes sheetUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.sheet-head{
  display:flex; align-items:center; gap:12px; padding:14px 18px;
  border-bottom:1px solid var(--line); background:var(--surface);
}
.sheet-head h2{font-family:var(--font-display); font-size:16.5px; margin:0; flex:1; font-weight:600}
.sheet-body{flex:1; overflow-y:auto; padding:20px 18px 32px; -webkit-overflow-scrolling:touch}
.sheet-foot{padding:14px 18px calc(16px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--surface)}

/* 测评 */
.q-progress{height:3px; background:var(--surface-2)}
.q-progress > i{display:block; height:100%; background:var(--accent); transition:width .35s}
.q-num{font-family:var(--font-mono); font-size:11.5px; color:var(--text-3); letter-spacing:.08em}
.q-title{font-family:var(--font-display); font-size:21px; font-weight:600; margin:8px 0 4px; text-wrap:balance; line-height:1.35}
.q-hint{font-size:13px; color:var(--text-3); margin:0 0 18px}
.opts{display:flex; flex-direction:column; gap:9px}
.opt{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:14px 15px; border-radius:var(--r);
  background:var(--surface); border:1.5px solid var(--line);
  font-size:14.5px; transition:.16s;
}
.opt:hover{border-color:color-mix(in srgb,var(--accent) 50%, var(--line)); background:var(--surface-2)}
.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.opt-mark{
  flex:none; width:19px; height:19px; border-radius:50%;
  border:1.8px solid var(--text-3); display:grid; place-items:center;
}
.opt[aria-pressed="true"] .opt-mark{border-color:var(--accent); background:var(--accent)}
.opt-mark i{width:7px;height:7px;border-radius:50%;background:#fff;opacity:0}
.opt[aria-pressed="true"] .opt-mark i{opacity:1}
.opt.multi .opt-mark{border-radius:5px}
.opt.multi .opt-mark i{border-radius:2px; width:8px; height:8px}

/* 滑块自评 */
.slider-row{margin-bottom:20px}
.slider-row label{display:flex; justify-content:space-between; font-size:14px; font-weight:600; margin-bottom:7px}
.slider-row label span{font-family:var(--font-mono); color:var(--accent); font-variant-numeric:tabular-nums}
input[type=range]{
  width:100%; height:26px; margin:0; background:transparent;
  -webkit-appearance:none; appearance:none;
}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:999px;background:var(--surface-2)}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none; width:22px; height:22px; border-radius:50%;
  background:var(--accent); border:3px solid var(--surface); margin-top:-8px;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}
input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--surface-2)}
input[type=range]::-moz-range-thumb{
  width:22px;height:22px;border-radius:50%;background:var(--accent);
  border:3px solid var(--surface); box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.slider-scale{display:flex; justify-content:space-between; font-size:11px; color:var(--text-3); margin-top:-2px}

/* 报告 */
.report-grade{
  display:flex; align-items:baseline; gap:10px;
  font-family:var(--font-display); font-size:24px; font-weight:600;
}
.stars{color:var(--gold); letter-spacing:.12em; font-size:19px}
.dim{padding:14px 0; border-bottom:1px solid var(--line)}
.dim:last-child{border-bottom:0; padding-bottom:0}
.dim-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:9px}
.dim-name{font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:7px}
.trigger-item{display:grid; grid-template-columns:1fr 46px; gap:10px; align-items:center; padding:7px 0; font-size:13.5px}
.trigger-item .num{color:var(--accent); font-weight:700; text-align:right; font-size:14px}

/* 急救 */
.sos-timer{
  font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  font-size:62px; font-weight:700; letter-spacing:-.02em;
  text-align:center; margin:6px 0 2px; color:var(--text);
}
.sos-quote{
  font-family:var(--font-display); font-size:17px; line-height:1.6;
  text-align:center; color:var(--text-2); margin:0 0 22px;
  text-wrap:balance; padding:0 8px;
}
.breathe-orb{
  width:172px; height:172px; margin:26px auto; border-radius:50%;
  background:radial-gradient(circle at 38% 32%, color-mix(in srgb,var(--accent) 62%, transparent), color-mix(in srgb,var(--accent) 14%, transparent) 72%);
  border:1px solid color-mix(in srgb,var(--accent) 45%, transparent);
  display:grid; place-items:center;
  font-family:var(--font-display); font-size:19px; color:var(--text);
  animation:orb 8s ease-in-out infinite;
}
@keyframes orb{0%,100%{transform:scale(.82)}50%{transform:scale(1.14)}}
.ground-step{
  padding:16px; border-radius:var(--r); background:var(--surface);
  border:1px solid var(--line); margin-bottom:11px;
}
.ground-step.active{border-color:var(--accent); background:var(--accent-soft)}
.ground-step.done{opacity:.5}
.ground-n{
  font-family:var(--font-mono); font-size:26px; font-weight:700;
  color:var(--accent); line-height:1;
}
.sense-inputs{display:flex; flex-direction:column; gap:7px; margin-top:11px}
.sense-inputs input{
  padding:10px 12px; border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--bg); color:var(--text); font-family:inherit; font-size:14px;
}
.sense-inputs input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}

/* 功法计时 */
.practice-timer{
  font-family:var(--font-mono); font-variant-numeric:tabular-nums;
  font-size:66px; font-weight:700; text-align:center; letter-spacing:-.02em;
  margin:14px 0 4px;
}
.practice-phase{
  text-align:center; font-family:var(--font-display); font-size:18px;
  color:var(--accent); min-height:1.6em; margin-bottom:6px;
}
.practice-cue{text-align:center; color:var(--text-2); font-size:13.5px; min-height:3em; padding:0 10px}
.ring-wrap{position:relative; width:220px; height:220px; margin:8px auto 0}
.ring-wrap svg{transform:rotate(-90deg); width:100%; height:100%}
.ring-bg{fill:none; stroke:var(--surface-2); stroke-width:8}
.ring-fg{fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .3s linear}
.ring-center{position:absolute; inset:0; display:grid; place-items:center; text-align:center}

/* 列表项（功法/文章/商城） */
.item{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  padding:14px 15px; border-radius:var(--r);
  background:var(--surface); border:1px solid var(--line);
  transition:.16s; margin-bottom:10px;
}
.item:hover{border-color:color-mix(in srgb,var(--accent) 40%, var(--line)); transform:translateY(-1px)}
.item-glyph{
  flex:none; width:44px; height:44px; border-radius:12px;
  display:grid; place-items:center; font-size:22px;
  background:var(--surface-2);
}
.item-main{flex:1; min-width:0}
.item-title{font-weight:650; font-size:14.5px; display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.item-sub{font-size:12px; color:var(--text-3); margin-top:2px}
.item-arrow{flex:none; color:var(--text-3)}
.item-arrow svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.item.locked{opacity:.5}
.stars-diff{color:var(--gold); font-size:11px; letter-spacing:.06em}

/* 文章正文 */
.article{max-width:34em}
.article h3{font-family:var(--font-display); font-size:19px; margin:24px 0 8px; font-weight:600}
.article p{margin:0 0 13px; color:var(--text-2); line-height:1.78}
.article strong{color:var(--text); font-weight:650}
.article ul{margin:0 0 14px; padding-left:20px; color:var(--text-2)}
.article li{margin-bottom:6px; line-height:1.7}
.article blockquote{
  margin:16px 0; padding:12px 16px; border-left:3px solid var(--accent);
  background:var(--accent-soft); border-radius:0 var(--r-sm) var(--r-sm) 0;
  font-size:14px; color:var(--text);
}
.article .src{font-size:11.5px; color:var(--text-3); font-style:italic}

/* 里程碑 */
.mile{
  display:flex; gap:14px; padding-bottom:20px; position:relative;
}
.mile:not(:last-child)::before{
  content:""; position:absolute; left:15px; top:34px; bottom:0; width:1.5px;
  background:var(--line);
}
.mile.reached:not(:last-child)::before{background:var(--accent)}
.mile-dot{
  flex:none; width:31px; height:31px; border-radius:50%;
  display:grid; place-items:center; font-size:15px;
  background:var(--surface-2); border:1.5px solid var(--line);
  position:relative; z-index:1;
}
.mile.reached .mile-dot{background:var(--accent-soft); border-color:var(--accent)}
.mile.next .mile-dot{border-color:var(--gold); border-style:dashed}
.mile-main{flex:1; padding-top:3px}
.mile-day{font-family:var(--font-mono); font-size:11.5px; color:var(--text-3); letter-spacing:.06em}
.mile-name{font-family:var(--font-display); font-size:16px; font-weight:600; margin:1px 0 3px}
.mile-reward{font-size:12.5px; color:var(--text-2)}

/* 勋章墙 */
.badge-wall{display:grid; grid-template-columns:repeat(auto-fill,minmax(88px,1fr)); gap:10px}
.badge{
  aspect-ratio:1; border-radius:var(--r); display:grid; place-items:center;
  background:var(--surface); border:1px solid var(--line); text-align:center;
  padding:8px; gap:2px;
}
.badge.on{background:var(--gold-soft); border-color:color-mix(in srgb,var(--gold) 40%, transparent)}
.badge.off{opacity:.4}
.badge-glyph{font-size:26px; line-height:1}
.badge-name{font-size:10.5px; color:var(--text-2); font-weight:600; line-height:1.3}

/* 图表 */
.spark{width:100%; height:66px; display:block; overflow:visible}
.spark .grid-line{stroke:var(--line); stroke-width:1; stroke-dasharray:2 3}
.spark .area{fill:color-mix(in srgb,var(--accent) 15%, transparent)}
.spark .line{fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round}
.spark .end-dot{fill:var(--accent)}
.week-strip{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; margin-top:10px}
.week-cell{
  aspect-ratio:1; border-radius:7px; background:var(--surface-2);
  display:grid; place-items:center; font-size:10.5px; color:var(--text-3);
  font-family:var(--font-mono);
}
.week-cell.hit{background:var(--accent); color:#fff; font-weight:700}
.week-cell.miss{background:var(--danger-soft); color:var(--danger)}
.week-cell.future{opacity:.4}

/* 对话（教练） */
.chat{display:flex; flex-direction:column; gap:11px; padding-bottom:8px}
.msg{max-width:84%; padding:11px 14px; border-radius:16px; font-size:14px; line-height:1.62}
.msg.bot{background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:5px; align-self:flex-start}
.msg.me{background:var(--accent); color:#fff; border-bottom-right-radius:5px; align-self:flex-end}
.chat-opts{display:flex; flex-direction:column; gap:8px; margin-top:6px}
.chat-opt{
  padding:11px 14px; border-radius:14px; text-align:left;
  background:var(--bg); border:1.5px solid var(--accent); color:var(--accent);
  font-size:13.5px; font-weight:600;
}
.chat-opt:hover{background:var(--accent-soft)}

/* Toast / 奖励 */
.toast-wrap{
  position:fixed; z-index:200; left:50%; transform:translateX(-50%);
  bottom:calc(140px + env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:8px; align-items:center;
  pointer-events:none; width:min(360px,90vw);
}
.toast{
  padding:11px 17px; border-radius:999px;
  background:var(--ink); color:#EAF2EF; font-size:13.5px; font-weight:600;
  box-shadow:var(--shadow-lg); animation:toastIn .3s cubic-bezier(.2,.9,.25,1);
  display:flex; align-items:center; gap:8px; text-align:center;
}
:root[data-theme="light"] .toast{background:var(--ink)}
.toast.gold{background:var(--amber); color:#1A1204}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}

/* 全屏庆祝 */
.celebrate{
  position:fixed; inset:0; z-index:300; display:none;
  place-items:center; text-align:center; padding:30px;
  background:color-mix(in srgb,var(--ink) 90%, transparent);
  backdrop-filter:blur(8px);
}
.celebrate.open{display:grid; animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.celebrate-glyph{font-size:88px; animation:pop .7s cubic-bezier(.2,1.4,.3,1)}
@keyframes pop{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.22) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.celebrate h2{font-family:var(--font-display); font-size:30px; color:#fff; margin:14px 0 6px; font-weight:600}
.celebrate p{color:rgba(234,242,239,.8); margin:0 0 24px; max-width:26em}
#confetti{position:fixed; inset:0; z-index:299; pointer-events:none; display:none}
#confetti.on{display:block}

/* 空状态 */
.empty{text-align:center; padding:34px 20px; color:var(--text-3)}
.empty-glyph{font-size:38px; opacity:.5; margin-bottom:10px}

/* 免责 */
.disclaimer{
  margin-top:24px; padding:13px 15px; border-radius:var(--r-sm);
  background:var(--surface-2); font-size:11.5px; color:var(--text-3); line-height:1.65;
}
.hidden{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

"use strict";
/* ============================================================
   Reborn — 应用逻辑
   纯前端，localStorage 持久化，无外部依赖
   ============================================================ */

/* ---------- 存储（带降级） ---------- */
const KEY = "reborn.state.v1";
let memStore = null;
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){ /* 隐私模式或禁用存储 */ }
  return null;
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ memStore = S; }
}

/* ---------- 日期工具 ---------- */
function today(){ return ymd(new Date()); }
function ymd(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function parseYmd(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function daysBetween(a,b){ return Math.round((parseYmd(b)-parseYmd(a))/86400000); }
function shiftDays(s,n){ const d=parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
function nowHour(){ return new Date().getHours(); }

/* ---------- 初始状态 ---------- */
function blankState(){
  return {
    v:1, onboarded:false,
    profile:null, report:null,
    startDate:today(), bestStreak:0, totalClean:0,
    coins:0, relapses:[],
    tasks:{}, practice:[], urges:[], read:[],
    pet:{ name:"", hunger:70, mood:70, energy:60, lastTick:today() },
    badges:[], skins:["default"], activeSkin:"default",
    eggs:[], theme:null, ratings:[],
    lockUntil:0
  };
}
let S = load() || blankState();
if(!S.pet) S.pet = blankState().pet;

/* ============================================================
   内容数据
   ============================================================ */

      [80,"第一式 两手托天理三焦","两手十指交叉于腹前，缓缓上托至头顶，翻掌上撑，仰头看手背。吸气上托，呼气下落。"],
      [80,"第二式 左右开弓似射雕","马步下蹲，左手成八字掌向左推出，右手如拉弓弦。目视左手食指尖。左右各三次。"],

    phases:[

const ARTICLES = [
  { id:"dopamine", cat:"大脑", glyph:"🧠", title:"成瘾如何劫持你的奖赏回路", min:4,
    body:`<p>大脑里有一条叫做<strong>中脑多巴胺通路</strong>的线路，它的本职工作是给"对生存有利的事"打分：吃饱了、被认可了、学会新技能了，它就释放多巴胺，让你记住"这事值得再做一次"。</p>
    <p>问题在于，这套系统是为<strong>稀缺环境</strong>设计的。祖先一年也遇不到几次高热量食物，所以多巴胺对"新奇 + 高刺激"给出的分数极高。而现在，无限滚动的色情内容提供的是<strong>永不重复的新奇性</strong>——这是自然界中根本不存在的刺激强度。</p>
    <h3>三个连锁反应</h3>
    <ul>
      <li><strong>受体下调。</strong>长期高频刺激后，多巴胺 D2 受体密度下降。同样的刺激量不再够用，这就是"越看越重口"的生理原因。</li>
      <li><strong>基线下移。</strong>受体减少后，日常小事（一顿饭、一次聊天、完成一份工作）释放的多巴胺不足以让你感到愉悦。现实变得"灰白"、"无聊"。</li>
      <li><strong>前额叶失守。</strong>负责刹车的前额叶皮层与奖赏中枢的连接减弱，冲动来时"理智上知道不该做，但身体已经在做了"。</li>
    </ul>
    <blockquote>关键认知：你感受到的不是"欲望强"，而是"基线低"。所以硬扛意志力是在错误的战场上打仗——真正要做的是把基线抬回来。</blockquote>
    <h3>好消息：这是可逆的</h3>
    <p>受体密度可以恢复。多数人在停止刺激后的 <strong>2 到 12 周</strong>内会感受到明显变化：现实中的小事重新变得有滋味，专注时长回升。这个过程被称为多巴胺基线重置，中间会经历一段"什么都没意思"的低谷期——那正是受体上调的过程，不是复发的理由。</p>
    <p class="src">相关领域：神经科学中的奖赏系统与受体可塑性研究。本文为科普性概述，非诊断依据。</p>` },

  { id:"deltafosb", cat:"大脑", glyph:"🧬", title:"为什么戒掉了还会突然想起来", min:3,
    body:`<p>很多人经历过这样的事：已经很久没碰了，状态也不错，突然某一天冲动汹涌而来，仿佛前面的努力都白费。</p>
    <p>这背后有一个叫 <strong>DeltaFosB</strong> 的蛋白。它在反复刺激中逐渐累积，把"刺激—奖赏"的关联<strong>写进长期记忆</strong>。它的半衰期很长，即使行为停止，这份记忆仍会保留相当长时间。</p>
    <h3>这意味着什么</h3>
    <ul>
      <li><strong>成瘾记忆不会被删除，只会被覆盖。</strong>你要建立的是更强的新回路，而不是擦掉旧回路。</li>
      <li><strong>突发的强烈冲动是正常现象，不是失败信号。</strong>它往往由某个线索（气味、场景、情绪状态）激活了旧记忆。</li>
      <li><strong>越久之后的冲动，强度反而可能越大。</strong>因为你放松了警惕，而记忆本身还在。</li>
    </ul>
    <blockquote>实操结论：不要因为"状态很好"就撤掉防护。诱因管理要一直做下去，这不是不信任自己，而是尊重生理规律。</blockquote>
    <p class="src">相关领域：成瘾记忆的分子机制研究。此处为简化科普。</p>` },

  { id:"anxiety", cat:"心理", glyph:"🌀", title:"成瘾—内疚—抑郁的恶性循环", min:3,
    body:`<p>成瘾行为本身造成的伤害，往往小于它引发的<strong>心理循环</strong>：</p>
    <ul>
      <li>行为发生 → 短暂快感</li>
      <li>快感退去 → 强烈内疚与自我厌恶</li>
      <li>内疚积累 → 情绪低落、回避社交</li>
      <li>情绪低落 → 更需要一个"快速逃离痛苦的出口"</li>
      <li>于是回到第一步，而且这次门槛更低</li>
    </ul>
    <h3>循环的真正燃料是羞耻，不是快感</h3>
    <p>研究一致发现：<strong>自我羞辱越重，复发越快</strong>。因为羞耻本身是一种痛苦，而成瘾行为正是这个人已经掌握的、最熟练的止痛方式。你用羞耻惩罚自己，等于给循环加油。</p>
    <blockquote>替换方案：把"我又完了，我真恶心"换成"这次是什么触发的？下次这个环节我可以怎么改？"——前者制造痛苦，后者产生信息。</blockquote>
    <p>这不是给自己找台阶下。恰恰相反，自我关怀在临床上被反复证明比自我批判带来更高的行为改变率。</p>
    <p class="src">相关领域：自我关怀与成瘾复发的相关性研究。</p>` },

  { id:"social", cat:"关系", glyph:"👥", title:"它如何悄悄拿走你的社交能力", min:3,
    body:`<p>成瘾对社交的损害很少是戏剧性的，它是<strong>缓慢的替换</strong>。</p>
    <h3>四条隐性路径</h3>
    <ul>
      <li><strong>时间挤占。</strong>每天 40 分钟，一年就是 240 小时——足够学会一门乐器或建立三段深度友谊。</li>
      <li><strong>期待扭曲。</strong>长期接触脚本化的性内容，会在无意中建立一套现实中不存在的互动预期，真实关系相比之下显得"麻烦"。</li>
      <li><strong>回避强化。</strong>社交需要承担被拒绝的风险，而成瘾提供零风险的即时满足。每次选择后者，回避的神经通路就被加强一次。</li>
      <li><strong>精力透支。</strong>睡眠不足与情绪低落直接降低社交意愿，形成"越不社交越不想社交"的下坠。</li>
    </ul>
    <blockquote>可操作的第一步：不要设"我要变得外向"这种目标。设"这周主动发起一次线下见面"这种可完成的具体动作。回避是靠一次次小的暴露拆掉的。</blockquote>` },

  { id:"body", cat:"身体", glyph:"💪", title:"疲劳、腰酸、脱发：分清哪些真的相关", min:4,
    body:`<p>这个领域最大的问题是<strong>信息两极化</strong>：一边把所有毛病都归因于此，一边说"完全无害"。两者都不准确。诚实地区分开来，反而更有帮助。</p>
    <h3>证据较明确的关联</h3>
    <ul>
      <li><strong>睡眠剥夺。</strong>深夜行为直接压缩深睡时间，而深睡是生长激素分泌与身体修复的主窗口。次日的疲劳、注意力涣散主要来自这里。</li>
      <li><strong>皮质醇升高。</strong>内疚与焦虑推高压力激素，长期偏高与腹部脂肪堆积、免疫力下降、肌肉合成受阻相关。</li>
      <li><strong>注意力碎片化。</strong>高频切换的刺激模式会降低持续专注能力，这一点在行为层面很容易自测。</li>
    </ul>
    <h3>关联被夸大或存在争议的</h3>
    <ul>
      <li><strong>脱发。</strong>雄性脱发主要由遗传与 DHT 敏感性决定。压力和睡眠可能加速，但把它当作主因并不成立。</li>
      <li><strong>"精气"损耗的量化说法。</strong>诸如"一次等于多少天营养"的具体数字缺乏可靠依据，不必据此恐慌。</li>
      <li><strong>不可逆损伤。</strong>绝大多数相关症状在停止后数周到数月内改善。</li>
    </ul>
    <blockquote>为什么要说清楚这些：靠恐惧驱动的改变通常只能维持几周。当你发现某个恐吓性说法是假的，往往会连真实的部分一起放弃。基于事实的动机才撑得久。</blockquote>
    <p class="src">如有持续的身体症状（长期疲劳、疼痛、脱发加速），应就诊排查其他原因，不要自行归因。</p>` },

  { id:"trigger", cat:"实操", glyph:"🎯", title:"诱因管理：把力气花在冲动之前", min:4,
    body:`<p>冲动一旦形成，你能调动的意志力资源已经很少了。真正有效的干预发生在<strong>冲动形成之前</strong>——这是本应用的核心逻辑。</p>
    <h3>四类诱因与对应动作</h3>
    <ul>
      <li><strong>视觉线索。</strong>清理关注列表，取消触发性账号；开启灰度模式降低视觉刺激强度；把推荐流替换为主动订阅的内容。</li>
      <li><strong>情绪线索。</strong>无聊、焦虑、孤独、压力是四大高发情绪。为每一种预先准备一个替代动作（无聊→出门散步；焦虑→腹式呼吸；孤独→给人打电话；压力→力量训练）。</li>
      <li><strong>场景线索。</strong>床、浴室、深夜独处是最常见的三个高危场景。手机不进卧室，是单条收益最高的规则。</li>
      <li><strong>生理线索。</strong>失眠与过度疲劳会显著削弱前额叶的抑制能力。把睡眠当成戒断计划的一部分，而不是附加项。</li>
    </ul>
    <blockquote>核心原则：改环境比改意志便宜得多。与其每晚在床上跟冲动搏斗，不如让手机根本不在卧室。</blockquote>
    <h3>15 分钟法则</h3>
    <p>冲动的强度曲线通常在 <strong>10 到 20 分钟</strong>内到达峰值并开始回落。你不需要"永远抵抗"，只需要撑过这一段。这就是急救倒计时的设计依据——把一个看起来不可能的任务，换成一个有明确终点的任务。</p>` },

  { id:"tcm", cat:"养生", glyph:"🌿", title:"补比戒更重要：能量视角的康复", min:3,
    body:`<p>只做"戒"这一件事的人，通常会经历一段空虚期：旧的快感来源被切断，新的没有建立起来，于是每天都在硬扛。这种状态很难维持超过几周。</p>
    <p>传统养生对此的思路是<strong>"损有余而补不足"</strong>——不是单纯压制，而是把亏空的部分补上来。翻译成现代语言：<strong>提升多巴胺基线，冲动的相对吸引力自然下降。</strong></p>
    <h3>三条补的路径</h3>
    <ul>
      <li><strong>动。</strong>八段锦、站桩这类内向型运动，除了体能收益，更重要的是训练"与不适共处"的能力——站桩时腿酸而不动，和冲动来时不动，是同一种能力。</li>
      <li><strong>晒与泡。</strong>晨间光照校准昼夜节律，睡前泡脚帮助入睡。这两件事成本极低而回报稳定，是最值得先做的。</li>
      <li><strong>吃与睡。</strong>锌、镁、优质蛋白、Omega-3 是激素合成的原料，长期缺乏时"精力不足"是必然结果，与意志无关。</li>
    </ul>
    <blockquote>判断标准：如果你每天都觉得在"忍"，说明补的部分没跟上。目标状态不是忍得住，而是不太想。</blockquote>

/* ============================================================
   工具函数

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function el(tag, cls, html){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(html != null) n.innerHTML = html;
  return n;
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function mmss(sec){
  sec = Math.max(0, Math.round(sec));
  return String(Math.floor(sec/60)).padStart(2,"0")+":"+String(sec%60).padStart(2,"0");
}

function toast(msg, gold){
  const t = el("div","toast"+(gold?" gold":""), esc(msg));
  $("#toasts").appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .3s, transform .3s"; t.style.opacity="0"; t.style.transform="translateY(-8px)"; }, 2100);
  setTimeout(()=> t.remove(), 2500);
}
function addCoins(n, why){
  S.coins += n; save();
  $("#coinChip").textContent = "◈ " + S.coins;
  if(why) toast("+" + n + " 金币 · " + why, true);

/* 庆祝 */
let confettiTimer = null;
function celebrate(glyph, title, text, onClose){
  $("#celGlyph").textContent = glyph;
  $("#celTitle").textContent = title;
  $("#celText").textContent = text;
  $("#celebrate").classList.add("open");
  $("#celBtn").onclick = ()=>{
    $("#celebrate").classList.remove("open");
    stopConfetti();
    if(onClose) onClose();
  };
  startConfetti();
}
function startConfetti(){
  const c = $("#confetti"), ctx = c.getContext("2d");
  c.classList.add("on");
  c.width = innerWidth; c.height = innerHeight;
  const reduce = matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduce) return;
  const colors = ["#10B981","#F59E0B","#EAF2EF","#8FE8C8"];
  const bits = Array.from({length:110}, ()=>({
    x: Math.random()*c.width,
    y: -20 - Math.random()*c.height*0.6,
    r: 3 + Math.random()*5,
    vy: 1.6 + Math.random()*2.8,
    vx: -0.9 + Math.random()*1.8,
    rot: Math.random()*Math.PI,
    vr: -0.06 + Math.random()*0.12,
    col: colors[(Math.random()*colors.length)|0]
  }));
  cancelAnimationFrame(confettiTimer);
  (function frame(){
    ctx.clearRect(0,0,c.width,c.height);
    let alive = false;
    for(const b of bits){
      b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      if(b.y < c.height + 30) alive = true;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
      ctx.fillStyle = b.col;
      ctx.fillRect(-b.r/2, -b.r/2, b.r, b.r*1.6);
      ctx.restore();
    }
    if(alive) confettiTimer = requestAnimationFrame(frame);
  })();
}
function stopConfetti(){
  cancelAnimationFrame(confettiTimer);
  const c = $("#confetti");
  c.getContext("2d").clearRect(0,0,c.width,c.height);
  c.classList.remove("on");
}

/* ---------- 面板（sheet） ---------- */
let sheetStack = [];
function openSheet(title, bodyNode, opts){
  opts = opts || {};
  sheetStack.push({title, bodyNode, opts});
  renderSheet();
}
function renderSheet(){
  const cur = sheetStack[sheetStack.length-1];
  if(!cur){ $("#sheet").classList.remove("open"); document.body.style.overflow=""; return; }
  $("#sheetTitle").textContent = cur.title;
  const body = $("#sheetBody");
  body.innerHTML = ""; body.appendChild(cur.bodyNode);
  body.scrollTop = 0;
  const foot = $("#sheetFoot");
  foot.innerHTML = "";
  if(cur.opts.foot){ foot.appendChild(cur.opts.foot); foot.classList.remove("hidden"); }
  else foot.classList.add("hidden");
  $("#sheetProgress").classList.toggle("hidden", cur.opts.progress == null);
  if(cur.opts.progress != null) $("#sheetProgress").firstElementChild.style.width = (cur.opts.progress*100)+"%";
  $("#sheetBack").classList.toggle("hidden", !!cur.opts.noBack);
  $("#sheetClose").classList.toggle("hidden", !cur.opts.noBack);
  $("#sheet").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closeSheet(){ sheetStack = []; renderSheet(); }
function popSheet(){ sheetStack.pop(); renderSheet(); }
function setSheetTitle(t){ if(sheetStack.length){ sheetStack[sheetStack.length-1].title = t; $("#sheetTitle").textContent = t; } }
function replaceSheetBody(node, opts){
  const cur = sheetStack[sheetStack.length-1];
  if(!cur) return;
  cur.bodyNode = node;
  if(opts) cur.opts = Object.assign({}, cur.opts, opts);
  renderSheet();
}
$("#sheetBack").onclick = ()=>{
  const cur = sheetStack[sheetStack.length-1];
  if(cur && cur.opts.onBack){ cur.opts.onBack(); return; }
  popSheet();
};
$("#sheetClose").onclick = ()=>{
  const cur = sheetStack[sheetStack.length-1];
  if(cur && cur.opts.onClose){ cur.opts.onClose(); return; }
  closeSheet();
};

   派生计算
   ============================================================ */
function cleanDays(){ return daysBetween(S.startDate, today()) + 1; }
function petStage(){
  const d = S.onboarded ? cleanDays() : 0;
  for(const s of PET_STAGES){ if(d >= s.from && d <= s.to) return s; }
  return PET_STAGES[PET_STAGES.length-1];
}
function unlockedPractices(){
  const d = cleanDays();
  return PRACTICES.filter(p => d >= p.unlock || p.unlock === 0);
}
function nextMilestone(){
  const d = cleanDays();
  return MILESTONES.find(m => m.d > d) || null;
}
function reachedMilestones(){
  const d = cleanDays();
  return MILESTONES.filter(m => m.d <= d);
}
function todayTasks(){
  const t = S.tasks[today()];
  return t || {};
}
function markTask(id, coin){
  const d = today();
  if(!S.tasks[d]) S.tasks[d] = {};
  if(S.tasks[d][id]) return false;
  S.tasks[d][id] = true;
  addCoins(coin, "完成任务");
  petGain(id);
  save();
  checkPerfectDay();
  return true;
}
function petGain(id){
  const p = S.pet;
  if(id === "sun"){ p.mood = Math.min(100, p.mood + 10); }
  else if(id === "sleep"){ p.energy = Math.min(100, p.energy + 15); }
  else if(id.startsWith("practice:")){ p.energy = Math.min(100, p.energy + 10); p.mood = Math.min(100, p.mood + 5); }
  else { p.mood = Math.min(100, p.mood + 4); p.energy = Math.min(100, p.energy + 3); }
  save();
}

/* 今日推荐任务清单（根据体质、解锁、时段动态生成） */
function planToday(){
  const con = (S.profile && S.profile.constitution) || "qi";
  const list = [];
  // 一个功法（早晚不同）
  const unlocked = unlockedPractices();
  const hour = nowHour();
  const wantWhen = hour < 12 ? "morning" : "evening";
  let pick = unlocked.filter(p => p.when === wantWhen);
  if(!pick.length) pick = unlocked;
  const dayIdx = daysBetween(S.startDate, today());
  const prac = pick[dayIdx % pick.length];
  list.push({ id:"practice:"+prac.id, name:prac.name, note:prac.min+" 分钟 · "+prac.good, coin:30,
              slot:prac.when === "morning" ? "morning" : "evening", act:()=>openPractice(prac) });
  // 体质对应的调理项优先
  const priority = { yang:["sun","footbath","sleep"], yin:["footbath","sleep","breath"],
                     qi:["sun","breath","sleep"], tan:["exercise","sun","water"] }[con];
  const chosen = [];
  for(const id of priority){ const r = RITUALS.find(x => x.id === id); if(r) chosen.push(r); }
  for(const r of RITUALS){ if(chosen.length >= 5) break; if(!chosen.includes(r)) chosen.push(r); }
  for(const r of chosen){
    list.push({ id:r.id, name:r.name, note:r.note, coin:r.coin, slot:r.when, act:()=>openRitual(r) });
  }
  // 一篇科普
  const unread = ARTICLES.filter(a => !S.read.includes(a.id));
  const art = unread.length ? unread[0] : ARTICLES[dayIdx % ARTICLES.length];
  list.push({ id:"read:"+art.id, name:"读一篇：" + art.title, note:art.min+" 分钟阅读", coin:20,
              slot:"any", act:()=>openArticle(art) });
  return list;
}
function checkPerfectDay(){
  const plan = planToday(), done = todayTasks();
  const all = plan.every(t => done[t.id]);
  if(all && !done.__perfect){
    S.tasks[today()].__perfect = true;
    addCoins(50, "完美日");
    save();

/* 每日结算：宠物状态衰减、里程碑、彩蛋 */
function dailyTick(){
  const p = S.pet;
  const gap = daysBetween(p.lastTick, today());
  if(gap > 0){
    p.hunger = Math.max(0, p.hunger - gap*12);
    p.mood   = Math.max(0, p.mood   - gap*9);
    p.energy = Math.max(0, p.energy - gap*7);
    p.lastTick = today();
    save();
  }
  // 里程碑：补齐所有已达成但未发放的奖励，只为最高的那个庆祝
  const d = cleanDays();
  const pending = MILESTONES.filter(m => d >= m.d && !S.badges.includes("m"+m.d));
  if(pending.length){
    let coins = 0;
    for(const m of pending){ S.badges.push("m"+m.d); coins += m.coin; }
    S.coins += coins;
    save();
    const top = pending[pending.length-1];
    const extra = pending.length > 1 ? "（含 " + pending.length + " 个里程碑的补发）" : "";
    setTimeout(()=> celebrate(top.glyph, "Day "+top.d+" · "+top.name,
      top.reward + "　已发放 " + coins + " 金币" + extra + "。"), 400);
  }
  checkEggs();
}
function checkEggs(){
  const h = nowHour(), d = today();
  const fire = (id, glyph, title, text) => {
    if(S.eggs.includes(id+":"+d)) return;
    S.eggs.push(id+":"+d); save();
    setTimeout(()=> toast(glyph + " " + title), 900);
    if(text) setTimeout(()=> toast(text), 3200);
  };
  if(h >= 23 || h < 2){
    fire("night","🌌","这么晚还不睡？","试试睡前的「打坐 · 数息」，10 分钟就够。");
  } else if(h === 5 || h === 6){
    fire("dawn","🌅","早起的人拥有世界","日出属于你。");
    if(!S.eggs.includes("dawnCoin:"+d)){
      S.eggs.push("dawnCoin:"+d);
      addCoins(20,"早起打卡");
    }
  }
  if(S.relapses.length && !S.eggs.includes("comeback:"+d) && daysBetween(S.relapses[S.relapses.length-1].d, d) === 1){
    S.eggs.push("comeback:"+d); save();
    setTimeout(()=> toast("🌱 跌倒之后还回来的人，比没跌倒的人更强"), 1200);
  }
}

function renderQuiz(){
  if(quizIdx >= QUIZ.length){ buildReport(); return; }
  const q = QUIZ[quizIdx];
  const wrap = el("div");
  const head = el("div");
  head.innerHTML = `<div class="q-num">问题 ${quizIdx+1} / ${QUIZ.length}</div>
                    <h2 class="q-title">${esc(q.t)}</h2>
                    <p class="q-hint">${esc(q.h)}</p>`;
  wrap.appendChild(head);

  const foot = el("div");
  const next = el("button","btn block", quizIdx === QUIZ.length-1 ? "生成我的诊断报告" : "下一题");

  if(q.type === "one"){
    const box = el("div","opts");
    q.o.forEach(([val,label])=>{
      const b = el("button","opt", `<span class="opt-mark"><i></i></span><span>${esc(label)}</span>`);
      b.type = "button";
      b.setAttribute("aria-pressed", quizAns[q.k] === val ? "true" : "false");
      b.onclick = ()=>{
        quizAns[q.k] = val;
        box.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed","false"));
        b.setAttribute("aria-pressed","true");
        next.disabled = false;
        setTimeout(()=>{ quizIdx++; renderQuiz(); }, 220);
      };
      box.appendChild(b);
    });
    wrap.appendChild(box);
    next.disabled = !quizAns[q.k];
    next.onclick = ()=>{ quizIdx++; renderQuiz(); };
  }
  else if(q.type === "multi"){
    if(!quizAns[q.k]) quizAns[q.k] = [];
    const box = el("div","opts");
    q.o.forEach(([val,label])=>{
      const b = el("button","opt multi", `<span class="opt-mark"><i></i></span><span>${esc(label)}</span>`);
      b.type = "button";
      const on = ()=> quizAns[q.k].includes(val);
      b.setAttribute("aria-pressed", on() ? "true" : "false");
      b.onclick = ()=>{
        const arr = quizAns[q.k];
        const i = arr.indexOf(val);
        if(i >= 0) arr.splice(i,1); else arr.push(val);
        b.setAttribute("aria-pressed", on() ? "true" : "false");
        next.disabled = arr.length === 0;
      };
      box.appendChild(b);
    });
    wrap.appendChild(box);
    wrap.appendChild(el("p","small","可以选多个，也可以只选一个。"));
    next.disabled = quizAns[q.k].length === 0;
    next.onclick = ()=>{ quizIdx++; renderQuiz(); };
  }
  else if(q.type === "slider"){
    if(!quizAns[q.k]) quizAns[q.k] = {};
    q.s.forEach(([key,label,lo,hi])=>{
      if(quizAns[q.k][key] == null) quizAns[q.k][key] = 5;
      const row = el("div","slider-row");
      row.innerHTML = `<label>${esc(label)}<span class="num" data-out>${quizAns[q.k][key]}</span></label>`;
      const inp = el("input");
      inp.type = "range"; inp.min = "1"; inp.max = "10"; inp.step = "1";
      inp.value = quizAns[q.k][key];
      inp.setAttribute("aria-label", label);
      const out = row.querySelector("[data-out]");
      inp.oninput = ()=>{ quizAns[q.k][key] = +inp.value; out.textContent = inp.value; };
      row.appendChild(inp);
      row.appendChild(el("div","slider-scale",`<span>${esc(lo)}</span><span>${esc(hi)}</span>`));
      wrap.appendChild(row);
    });
    next.disabled = false;
    next.onclick = ()=>{ quizIdx++; renderQuiz(); };
  }
  foot.appendChild(next);

  replaceSheetBody(wrap, {
    foot,
    progress: quizIdx / QUIZ.length,
    noBack: false,
    onBack: ()=>{ if(quizIdx === 0){ startQuiz(); } else { quizIdx--; renderQuiz(); } }
  });
  setSheetTitle("个人诊断");
}

function computeProfile(a){
  // 严重度评分
  let sev = 0;
  sev += ({"<1":1,"1-3":2,"3-5":3,"5-10":4,"10+":5})[a.years] || 2;
  sev += ({daily:5, w3:4, w1:3, m:2, down:1})[a.freq] || 3;
  sev += ({"<12":3,"12-15":2,"16-18":1,"18+":0})[a.firstAge] || 1;
  const bodyAvg = avg(Object.values(a.body));
  const mindAvg = avg(Object.values(a.mind));
  sev += bodyAvg > 7 ? 2 : bodyAvg > 5 ? 1 : 0;
  sev += mindAvg > 7 ? 2 : mindAvg > 5 ? 1 : 0;
  // 1..5 星
  const stars = Math.max(1, Math.min(5, Math.round(sev / 3.4)));
  const gradeName = ["轻度","轻中度","中度","中重度","重度"][stars-1];

  // 康复周期预估
  const base = 90;
  const extra = (({"<1":0,"1-3":10,"3-5":20,"5-10":35,"10+":50})[a.years] || 10)
              + (({daily:25, w3:15, w1:8, m:3, down:0})[a.freq] || 10);
  const lo = base + Math.round(extra*0.6), hi = base + extra + 20;

  // 体质
  const cMap = { yang:"yang", yin:"yin", qi:"qi", tan:"tan" };
  let constitution = "qi";
  const cs = (a.consti || []).filter(x => x !== "none");
  if(cs.length) constitution = cMap[cs[0]];
  else {
    if(a.body.fatigue >= 7) constitution = "yang";
    else if(a.mind.anxiety >= 7 || a.body.sleepQ >= 7) constitution = "yin";
    else if(a.body.focus >= 7) constitution = "tan";
  }

  // 诱因排序：情绪 > 场景 > 视觉（权重）
  const raw = [];
  (a.tEmotion || []).forEach((k,i) => raw.push({ k, w: 30 - i*5, kind:"情绪" }));
  (a.tScene || []).forEach((k,i)   => raw.push({ k, w: 22 - i*4, kind:"场景" }));
  (a.tVisual || []).forEach((k,i)  => raw.push({ k, w: 16 - i*3, kind:"视觉" }));
  const total = raw.reduce((s,x) => s + Math.max(2,x.w), 0) || 1;
  const triggers = raw
    .map(x => ({ ...x, pct: Math.round(Math.max(2,x.w) / total * 100) }))
    .sort((x,y) => y.pct - x.pct)
    .slice(0,4);

  // 高危时段
  const sc = a.tScene || [];
  let window = "22:00 – 01:00";
  if(sc.includes("night")) window = "23:00 – 02:00";
  else if(sc.includes("bed")) window = "22:30 – 00:30";
  else if(sc.includes("work")) window = "13:00 – 15:00";
  else if(sc.includes("home")) window = "全天独处时段";

  const goalDays = a.goal === "life" ? 9999 : +a.goal;

  return {
    stars, gradeName, cycleLo:lo, cycleHi:hi, constitution,
    triggers, window, goalDays,
    bodyAvg:+bodyAvg.toFixed(1), mindAvg:+mindAvg.toFixed(1),
    body:a.body, mind:a.mind,
    motives:a.motive || [], tried:a.tried
  };
}
function avg(arr){ return arr.reduce((s,x) => s + x, 0) / (arr.length || 1); }

}

function pickDailyArticle(){
  const unread = ARTICLES.filter(a => !S.read.includes(a.id));
  if(unread.length) return unread[0];
  return ARTICLES[daysBetween(S.startDate, today()) % ARTICLES.length];
}
function isRiskNow(win){
  const m = win.match(/(\d{1,2}):\d{2}\s*[–-]\s*(\d{1,2}):\d{2}/);
  if(!m) return false;
  const h = nowHour(), a = +m[1], b = +m[2];
  return a <= b ? (h >= a && h < b) : (h >= a || h < b);
}

/* ============================================================
   功法跟练（真实计时 + 分节引导）
   ============================================================ */
let practiceIV = null;
function openPractice(p){
  const total = p.phases.reduce((s,x) => s + x[0], 0);
  let elapsed = 0, phaseIdx = 0, phaseLeft = p.phases[0][0], running = false;

  const wrap = el("div");
  wrap.innerHTML = `
    <div class="ring-wrap">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="ring-bg" cx="50" cy="50" r="44"></circle>
        <circle class="ring-fg" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="276.5"></circle>
      </svg>
      <div class="ring-center">
        <div>
          <div class="practice-timer" id="pTime" style="font-size:34px;margin:0">${mmss(total)}</div>
          <div class="small" id="pStep">共 ${p.phases.length} 节</div>
        </div>
      </div>
    </div>
    <div class="practice-phase" id="pPhase">${esc(p.phases[0][1])}</div>
    <div class="practice-cue" id="pCue">${esc(p.phases[0][2])}</div>`;

  const ring = wrap.querySelector(".ring-fg");
  const tEl = wrap.querySelector("#pTime");
  const phEl = wrap.querySelector("#pPhase");
  const cueEl = wrap.querySelector("#pCue");
  const stepEl = wrap.querySelector("#pStep");

  const list = el("div");
  list.style.marginTop = "24px";
  list.innerHTML = `<div class="time-head"><span>动作分节</span></div>`;
  p.phases.forEach((ph,i)=>{
    const d = el("div","ground-step");
    d.dataset.i = i;
    d.innerHTML = `<div class="row" style="align-items:flex-start;gap:11px">
      <span class="ground-n">${i+1}</span>
      <div><b style="font-size:14px">${esc(ph[1])}</b><p class="small" style="margin:3px 0 0">${esc(ph[2])}</p>
      <span class="small num" style="color:var(--text-3)">${mmss(ph[0])}</span></div></div>`;
    list.appendChild(d);
  });
  wrap.appendChild(list);
  wrap.appendChild(el("div","disclaimer","练习中如出现头晕、心慌、关节疼痛，请立即停止。有心血管疾病、高血压或近期手术史者，练习前请咨询医师。动作宁慢勿快，宁轻勿重。"));

  function paint(){
    const pct = elapsed / total;
    ring.style.strokeDashoffset = String(276.5 * (1 - pct));
    tEl.textContent = mmss(total - elapsed);
    stepEl.textContent = "第 " + (phaseIdx+1) + " / " + p.phases.length + " 节";
    phEl.textContent = p.phases[phaseIdx][1];
    cueEl.textContent = p.phases[phaseIdx][2];
    list.querySelectorAll(".ground-step").forEach(n=>{
      const i = +n.dataset.i;
      n.classList.toggle("active", i === phaseIdx);
      n.classList.toggle("done", i < phaseIdx);
    });
  }

  const foot = el("div");
  const startBtn = el("button","btn block","开始跟练");
  const doneBtn = el("button","btn ghost block","直接标记完成");
  doneBtn.style.marginTop = "8px";
  foot.appendChild(startBtn); foot.appendChild(doneBtn);

  function finish(){
    clearInterval(practiceIV); practiceIV = null;
    S.practice.push({ d:today(), id:p.id, min:p.min });
    markTask("practice:"+p.id, 30);
    save();
    closeSheet(); renderAll();
    celebrate(p.glyph, "练完了", p.name + "　" + p.min + " 分钟。这类内向型练习真正训练的是「与不适共处」——站桩时腿酸而不动，和冲动来时不动，是同一种能力。");
  }

  startBtn.onclick = ()=>{
    if(running){
      clearInterval(practiceIV); practiceIV = null; running = false;
      startBtn.textContent = "继续"; return;
    }
    running = true; startBtn.textContent = "暂停";
    practiceIV = setInterval(()=>{
      elapsed++; phaseLeft--;
      if(phaseLeft <= 0 && phaseIdx < p.phases.length-1){
        phaseIdx++; phaseLeft = p.phases[phaseIdx][0];
        toast("第 " + (phaseIdx+1) + " 节 · " + p.phases[phaseIdx][1]);
      }
      paint();
      if(elapsed >= total) finish();
    }, 1000);
  };
  doneBtn.onclick = ()=>{
    if(practiceIV){ clearInterval(practiceIV); practiceIV = null; }
    finish();
  };

  paint();
  openSheet(p.name, wrap, { foot, onBack:()=>{
    if(practiceIV){ clearInterval(practiceIV); practiceIV = null; }
    popSheet();
  }});
}

/* 教练对话 */
function openCoach(){
  const wrap = el("div");
  const chat = el("div","chat");
  wrap.appendChild(chat);
  wrap.appendChild(el("div","disclaimer","这是一套基于 CBT 原则编写的引导式对话脚本，不是真人也不是生成式 AI，无法处理危机情况。如有自伤念头，请立即联系专业心理援助或前往急诊。"));

  function say(cls, text){
    const m = el("div","msg " + cls);
    m.innerHTML = text.replace(/\n/g,"<br>");
    chat.appendChild(m);
    wrap.scrollIntoView && $("#sheetBody").scrollTo({ top: 99999, behavior:"smooth" });
  }
  function go(key){
    const node = COACH[key];
    if(!node) return;
    setTimeout(()=>{
      say("bot", node.bot);
      if(node.opts && node.opts.length){
        const box = el("div","chat-opts");
        node.opts.forEach(o=>{
          const b = el("button","chat-opt", esc(o.t));
          b.onclick = ()=>{
            box.remove();
            say("me", esc(o.t));
            if(o.go === "ground_jump"){ openGrounding(); return; }
            if(o.go === "go_practice"){ popSheet(); switchView("energy"); return; }
            if(o.go === "go_restart"){ popSheet(); openRestart(); return; }
            if(o.go === "go_lock"){ offerLock(); return; }
            go(o.go);
          };
          box.appendChild(b);
        });
        chat.appendChild(box);
        $("#sheetBody").scrollTo({ top: 99999, behavior:"smooth" });
      } else {
        addCoins(15,"完成一次对话");
      }
    }, 380);
  }
  openSheet("康复教练", wrap);
  go("start");
}

  });

  // 商城
  v.appendChild(el("h3","h-sec","商城"));
  SHOP.forEach(s=>{
    const owned = S.skins.includes(s.id);
    const b = el("button","item");
    b.innerHTML = `<span class="item-glyph">${s.glyph}</span>

    v.appendChild(b);

  // 设置
  v.appendChild(el("h3","h-sec","设置"));
  const rows = [
    { t:"重看诊断报告", s:"包含体质、诱因与方案", act:()=> showReport(false) },
    { t:"每周复评", s:"7 天一次，用于调整方案", act:openReeval },
    { t:"重新开始", s:"复发之后走这里 · 不会有羞辱", act:openRestart, danger:true },
    { t:"清除全部数据", s:"不可恢复", act:wipe, danger:true }
  ];
  rows.forEach(r=>{
    const b = el("button","item");
    b.innerHTML = `<span class="item-main"><span class="item-title" style="${r.danger?"color:var(--danger)":""}">${esc(r.t)}</span>
      <span class="item-sub">${esc(r.s)}</span></span>
      <span class="item-arrow"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span>`;
    b.onclick = r.act;
    v.appendChild(b);
  });

  v.appendChild(el("div","disclaimer","Reborn 是自助工具，不提供医疗服务。所有数据仅保存在本设备浏览器中，不上传、不联网。如遇严重情绪危机，请立即联系当地心理援助热线或前往医院急诊。"));
}

function sparkline(data){
  const w = 300, h = 66, max = Math.max(...data, 1);
  const pts = data.map((v,i) => [i/(data.length-1)*w, h - (v/max)*(h-8) - 4]);
  const line = pts.map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${w} ${h} L0 ${h} Z`;
  const svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("class","spark");
  svg.setAttribute("viewBox","0 0 " + w + " " + h);
  svg.setAttribute("preserveAspectRatio","none");
  svg.setAttribute("role","img");
  svg.setAttribute("aria-label","近 14 天每日完成任务数趋势");
  svg.innerHTML = `
    <line class="grid-line" x1="0" y1="${h/2}" x2="${w}" y2="${h/2}"></line>
    <path class="area" d="${area}"></path>
    <path class="line" d="${line}"></path>
    <circle class="end-dot" cx="${pts[pts.length-1][0].toFixed(1)}" cy="${pts[pts.length-1][1].toFixed(1)}" r="3.4"></circle>`;
  return svg;
}

function buy(s){
  if(S.skins.includes(s.id)){ toast("已经拥有了"); return; }
  if(S.coins < s.price){ toast("还差 " + (s.price - S.coins) + " 金币"); return; }
  S.coins -= s.price;
  if(s.kind === "box"){
    const roll = Math.random();
    if(roll < 0.55){ const c = 30 + Math.floor(Math.random()*90); S.coins += c; toast("开出 " + c + " 金币", true); }
    else if(roll < 0.85){ toast("开出皮肤碎片 ×2"); }
    else {
      const locked = SHOP.filter(x => x.kind === "skin" && !S.skins.includes(x.id));
      if(locked.length){ S.skins.push(locked[0].id); toast("稀有！开出「" + locked[0].name + "」", true); }
      else { S.coins += 120; toast("开出 120 金币", true); }
    }
  } else {
    S.skins.push(s.id);
    toast("已获得「" + s.name + "」", true);
  }
  save();
  $("#coinChip").textContent = "◈ " + S.coins;
  renderMe();
}

/* 每周复评 */
function openReeval(){
  const wrap = el("div");
  wrap.innerHTML = `<p class="lede">和入职时问的是同样的问题。对比两次的结果，你能看到变化发生在哪里。</p>`;
  const keys = [["fatigue","疲劳程度"],["focus","专注力"],["anxiety","焦虑程度"],["low","情绪低落"]];
  const vals = {};
  const base = S.report;
  keys.forEach(([k,l])=>{
    const start = base.body[k] != null ? base.body[k] : base.mind[k];
    vals[k] = start;
    const row = el("div","slider-row");
    row.innerHTML = `<label>${l}<span class="num" data-out>${start}</span></label>`;
    const inp = el("input");
    inp.type = "range"; inp.min = "1"; inp.max = "10"; inp.value = start;
    inp.setAttribute("aria-label", l);
    const out = row.querySelector("[data-out]");
    inp.oninput = ()=>{ vals[k] = +inp.value; out.textContent = inp.value; };
    row.appendChild(inp);
    row.appendChild(el("div","slider-scale","<span>好</span><span>差</span>"));
    wrap.appendChild(row);
  });
  const foot = el("div");
  const b = el("button","btn block","提交复评");
  b.onclick = ()=>{
    S.ratings.push({ d:today(), v:vals });
    addCoins(40,"完成每周复评");
    save();
    // 对比
    const diffs = keys.map(([k,l])=>{
      const start = base.body[k] != null ? base.body[k] : base.mind[k];
      return { l, delta: vals[k] - start };
    });
    const better = diffs.filter(x => x.delta < 0);
    closeSheet();
    celebrate("📈","复评完成",
      better.length
        ? better.map(x => x.l + "改善 " + Math.abs(x.delta) + " 分").join("；") + "。这些不是错觉，是记录。"
        : "这次没有明显变化——很正常，身体的恢复不是线性的。继续做下去，两周后再看。");
  };
  foot.appendChild(b);
  openSheet("每周复评", wrap, { foot });
}

/* 重新开始（relapse） */
function openRestart(){
  const answers = {};
  const wrap = el("div");
  wrap.innerHTML = `
    <div style="text-align:center;font-size:46px;margin:4px 0 12px">🔁</div>
    <h2 class="h-display" style="text-align:center">这不是终点</h2>
    <p class="lede" style="text-align:center;margin-left:auto;margin-right:auto">
      天数是计分板，不是资产。它归零的时候，你学到的东西一样都没丢。<br>
      现在只做一件事：复盘，不自责。</p>`;
  const qs = [
    { k:"scene", t:"前 2 小时你在做什么？", o:["在床上刷手机","独自在家","刚下班/放学","熬夜到很晚","出门在外","记不清了"] },
    { k:"emotion", t:"当时的情绪最接近哪一种？", o:["无聊","焦虑或压力大","孤独","累到极点","刚完成任务想放松","说不清"] },
    { k:"weak", t:"哪一个环节如果不同，结果就会不同？", o:["手机不在身边","早点睡","出门或找人说话","当时按了急救按钮","不确定"] }
  ];
  qs.forEach(q=>{
    const c = el("div","card");
    c.innerHTML = `<b style="font-size:14.5px">${esc(q.t)}</b>`;
    const box = el("div","opts");
    box.style.marginTop = "10px";
    q.o.forEach(o=>{
      const b = el("button","opt", `<span class="opt-mark"><i></i></span><span>${esc(o)}</span>`);
      b.setAttribute("aria-pressed","false");
      b.onclick = ()=>{
        answers[q.k] = o;
        box.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed","false"));
        b.setAttribute("aria-pressed","true");
      };
      box.appendChild(b);
    });
    c.appendChild(box);
    wrap.appendChild(c);
  });
  const foot = el("div");
  const b = el("button","btn block","记录并重新开始");
  b.onclick = ()=>{
    const d = cleanDays();
    S.bestStreak = Math.max(S.bestStreak, d);
    S.totalClean += d;
    S.relapses.push({ d:today(), days:d, why:answers });
    S.startDate = today();
    S.tasks[today()] = {};
    S.pet.mood = Math.max(20, S.pet.mood - 15);
    save();
    closeSheet(); renderAll();
    const fix = answers.weak && answers.weak !== "不确定"
      ? "下一次的关键环节：" + answers.weak + "。已经记在你的诱因图谱里。"
      : "这次没找到明确的薄弱环节也没关系，多记几次就看出模式了。";
    celebrate("🌱","第 1 天，重新开始",
      "上一轮你坚持了 " + d + " 天，累计已经清醒 " + S.totalClean + " 天——这个数字永远不会归零。" + fix);
  };
  const b2 = el("button","btn ghost block","我按错了，返回");
  b2.style.marginTop = "8px";
  b2.onclick = closeSheet;
  foot.appendChild(b); foot.appendChild(b2);
  openSheet("重新开始", wrap, { foot });
}

function wipe(){
  if(!confirm("这会清除全部记录，包括天数、金币和测评结果。不可恢复。确定吗？")) return;
  if(!confirm("再确认一次：真的要清除吗？")) return;
  try{ localStorage.removeItem(KEY); }catch(e){}
  S = blankState();
  closeSheet();
  location.reload();
}
